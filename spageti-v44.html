          <button class="icon-btn" data-act="reply" title="Reply">${I.reply}</button>
          <button class="icon-btn" data-act="forward" title="Forward">${I.forward}</button>
          <button class="icon-btn" data-act="star" title="Star">${I.star}</button>
          <button class="icon-btn" data-act="unread" title="Mark unread">✉</button>
          <button class="icon-btn" data-act="del" title="Delete">${I.trash}</button>
        </div>
      </div>
      <div class="body">${esc(m.body)}</div>`;

    $('[data-back]', readerEl).onclick = () => gridEl.classList.remove('reader-open');
    $$('[data-act]', readerEl).forEach(b => b.onclick = async () => {
      const a = b.dataset.act;
      if (a === 'star') { m.starred = !m.starred; save(); renderList(); renderReader(); renderRail(); }
      if (a === 'unread') { m.unread = true; save(); renderList(); renderReader(); renderRail(); }
      if (a === 'del') {
        if (await confirmDialog('Delete?', `"${m.subject}" will be moved to Trash.`)) {
          m.folder = 'trash'; selectedId = null; save(); renderRail(); renderList(); renderReader();
        }
      }
      if (a === 'reply') compose({ to: m.email, subject: 'Re: ' + m.subject, body: '\n\nOn ' + new Date(m.time).toLocaleString() + ', ' + m.from + ' wrote:\n> ' + m.body.split('\n').join('\n> ') });
      if (a === 'forward') compose({ subject: 'Fwd: ' + m.subject, body: '\n\n---------- Forwarded message ----------\nFrom: ' + m.from + '\n' + m.body });
    });
  }

  function select(id) {
    selectedId = id;
    const m = msgs.find(x => x.id === id);
    if (m && m.unread) { m.unread = false; save(); renderRail(); }
    renderList(); renderReader(); gridEl.classList.add('reader-open');
  }

  railEl.addEventListener('click', e => {
    const b = e.target.closest('[data-f]');
    if (!b) return;
    folder = b.dataset.f; selectedId = null;
    gridEl.classList.remove('reader-open');
    renderRail(); renderList(); renderReader();
  });
  listEl.addEventListener('click', e => {
    const r = e.target.closest('[data-id]');
    if (r) select(r.dataset.id);
  });

  function compose(pre = {}) {
    modal('New message',
      `<div class="fields">
        <div><label>To</label><input class="field" id="cTo" value="${esc(pre.to || '')}" placeholder="name@example.com"></div>
        <div><label>Subject</label><input class="field" id="cSub" value="${esc(pre.subject || '')}"></div>
        <div><label>Message</label><textarea class="field" id="cBody" rows="8">${esc(pre.body || '')}</textarea></div>
      </div>
      <div class="actions">
        <button class="btn ghost" data-x>Cancel</button>
        <button class="btn" data-draft>Save draft</button>
        <button class="btn primary" data-send>Send</button>
      </div>`,
      (back, close) => {
        $('[data-x]', back).onclick = close;
        $('[data-draft]', back).onclick = () => {
          const to = $('#cTo', back).value.trim();
          const sub = $('#cSub', back).value.trim() || '(no subject)';
          const body = $('#cBody', back).value;
          msgs.push({ id: uid(), folder:'drafts', from:'You', email:'me@spageti.app', to,
            subject: sub, preview: body.slice(0, 80), body, time: Date.now(), unread:false, starred:false });
          save(); close(); toast('Draft saved');
          folder = 'drafts'; renderRail(); renderList();
        };
        $('[data-send]', back).onclick = () => {
          const to = $('#cTo', back).value.trim();
          const sub = $('#cSub', back).value.trim() || '(no subject)';
          const body = $('#cBody', back).value;
          if (!to) { toast('Add a recipient'); return; }
          const msg = { id: uid(), folder:'sent', from:'You', email:'me@spageti.app', to,
            subject: sub, preview: body.slice(0, 80), body, time: Date.now(), unread:false, starred:false };
          msgs.push(msg);
          save(); close();
          toast('Message sent', 2600, () => {
            msgs = msgs.filter(x => x.id !== msg.id);
            save(); renderRail(); renderList();
          });
          folder = 'sent'; renderRail(); renderList();
        };
      });
  }

  $('#composeBtn', tools).onclick = () => compose();
  $('#refreshBtn', tools).onclick = () => { renderRail(); renderList(); renderReader(); toast('Refreshed'); };
  $('#emptyTrashBtn', tools).onclick = async () => {
    const removed = msgs.filter(m => m.folder === 'trash');
    if (!removed.length) { toast('Trash is empty'); return; }
    if (await confirmDialog('Empty trash?', 'All messages in Trash will be permanently deleted.')) {
      msgs = msgs.filter(m => m.folder !== 'trash');
      save(); selectedId = null; renderRail(); renderList(); renderReader();
      toast(`Deleted ${removed.length} message${removed.length === 1 ? '' : 's'}`, 5000, () => {
        msgs = [...msgs, ...removed];
        save(); renderRail(); renderList();
      });
    }
  };

  renderRail(); renderList(); renderReader();
}

/* ==========================================================================
   11. VAULT — files
   ========================================================================== */
function mountVault(root, tools) {
  const KEY = 'vault:files';
  let files = store.get(KEY, []);
  let cwd = null;
  let view = 'grid';
  let sortBy = 'name';
  const bk = f => 'v:' + f.id;

  tools.innerHTML = `
    <button class="btn sm" id="newFolder">${I.plus} Folder</button>
    <button class="btn primary sm" id="uploadBtn">${I.upload} Upload</button>
    <button class="btn ghost sm" id="viewToggle" title="Toggle view">⊞</button>
    <button class="btn ghost sm" id="sortBtn">Sort: name</button>`;

  root.innerHTML = `
    <div class="vault">
      <div class="vault-toolbar">
        <div class="vault-crumbs" id="crumbs"></div>
        <div style="flex:1"></div>
        <span style="font-size:12px;color:var(--muted)" id="vaultStats"></span>
      </div>
      <div class="drop" id="drop">
        <div style="font-size:36px;margin-bottom:8px">📁</div>
        <div style="font-weight:600;color:var(--text);margin-bottom:4px">Drop files here</div>
        <div style="font-size:12px">or click Upload · files are stored on this device</div>
      </div>
      <div class="vault-grid" id="fileGrid"></div>
    </div>`;

  const gridEl = $('#fileGrid', root);
  const crumbsEl = $('#crumbs', root);
  const dropEl = $('#drop', root);
  const statsEl = $('#vaultStats', root);

  function save() { return store.set(KEY, files); }
  function current() { return files.filter(f => (f.parent || null) === cwd); }
  function descendants(id) {
    const out = [];
    (function walk(pid) { files.filter(x => (x.parent || null) === pid).forEach(c => { out.push(c); if (c.type === 'folder') walk(c.id); }); })(id);
    return out;
  }
  function fmtSize(n) {
    if (!n) return '—';
    if (n < 1024) return n + ' B';
    if (n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
    if (n < 1024*1024*1024) return (n/1024/1024).toFixed(1) + ' MB';
    return (n/1024/1024/1024).toFixed(2) + ' GB';
  }
  // URL for a file's contents (new blob storage, or legacy base64 not yet migrated)
  async function fileUrl(f) {
    if (f.blob) { try { return await blobs.url(bk(f)); } catch { return null; } }
    return f.data || null;
  }
  const MISSING = 'This file has no stored content (it was added before file storage was upgraded and was too large to keep).';

  function render() {
    const items = current().sort((a, b) => {
      if (a.type !== b.type) return a.type === 'folder' ? -1 : 1;
      if (sortBy === 'size') return (b.size || 0) - (a.size || 0);
      if (sortBy === 'date') return (b.time || 0) - (a.time || 0);
      return a.name.localeCompare(b.name);
    });
    statsEl.textContent = `${items.length} item${items.length === 1 ? '' : 's'}`;
    gridEl.className = 'vault-grid' + (view === 'list' ? ' list' : '');

    const chain = []; let p = cwd;
    while (p) { const f = files.find(x => x.id === p); if (!f) break; chain.unshift(f); p = f.parent || null; }
    crumbsEl.innerHTML = `<button data-crumb="">Vault</button>` + chain.map(f => `<span>›</span><button data-crumb="${f.id}">${esc(f.name)}</button>`).join('');

    if (!items.length) {
      gridEl.innerHTML = `<div style="grid-column:1/-1" class="empty-state"><h3>Empty folder</h3><p>Drop some files above, or click Upload.</p></div>`;
      return;
    }
    gridEl.innerHTML = items.map(f => {
      const isImg = f.type === 'file' && /^image\//.test(f.mime || '') && (f.blob || f.data);
      const icon = f.type === 'folder' ? '📁' : isImg ? '🖼' : '📄';
      return `<div class="file-card" data-id="${f.id}">
        <div class="acts">
          <button class="mini" data-rename="${f.id}" title="Rename">✎</button>
          ${f.type === 'file' ? `<button class="mini" data-download="${f.id}" title="Download">⬇</button>` : ''}
          <button class="mini" data-del="${f.id}" title="Delete">×</button>
        </div>
        <div class="ft">${isImg ? `<img data-thumb="${f.id}" alt="" hidden><span class="ph" style="font-size:38px">${icon}</span>` : `<div style="font-size:38px">${icon}</div>`}</div>
        <div class="fn">${esc(f.name)}</div>
        <div class="fm">${f.type === 'folder' ? 'Folder' : fmtSize(f.size)}</div>
      </div>`;
    }).join('');
    $$('[data-thumb]', gridEl).forEach(async img => {
      const f = files.find(x => x.id === img.dataset.thumb);
      const u = f && await fileUrl(f);
      if (u && img.isConnected) { img.src = u; img.hidden = false; const ph = img.nextElementSibling; if (ph) ph.remove(); }
    });
  }

  async function addFiles(list) {
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
    const added = [];
    let firstErr = null;
    for (const file of list) {
      const f = { id: uid(), type:'file', name: file.name, size: file.size, mime: file.type, blob: true, parent: cwd, time: Date.now() };
      try { await blobs.put(bk(f), file); files.push(f); added.push(f); }
      catch (e) { firstErr = firstErr || e; }
    }
    if (added.length && !save()) {
      files = files.filter(f => !added.includes(f));
      await Promise.all(added.map(f => blobs.del(bk(f)).catch(() => {})));
      added.length = 0;
    }
    render();
    if (added.length) toast(`${added.length} file${added.length === 1 ? '' : 's'} added`);
    const failed = list.length - added.length;
    if (failed && firstErr) toast(`${failed} file${failed === 1 ? '' : 's'} couldn't be saved: ${firstErr.message || 'storage error'}`, 5000);
  }

  dropEl.addEventListener('dragover', e => { e.preventDefault(); dropEl.classList.add('over'); });
  dropEl.addEventListener('dragleave', () => dropEl.classList.remove('over'));
  dropEl.addEventListener('drop', e => { e.preventDefault(); dropEl.classList.remove('over'); if (e.dataTransfer.files.length) addFiles([...e.dataTransfer.files]); });
  dropEl.addEventListener('click', () => pickFiles());
  function pickFiles() {
    const inp = document.createElement('input'); inp.type = 'file'; inp.multiple = true;
    inp.onchange = () => { if (inp.files.length) addFiles([...inp.files]); };
    inp.click();
  }

  $('#uploadBtn', tools).onclick = pickFiles;
  $('#newFolder', tools).onclick = async () => {
    const name = await promptDialog('New folder', '', 'Folder name');
    if (!name) return;
    files.push({ id: uid(), type:'folder', name, parent: cwd, time: Date.now() });
    save(); render();
  };
  $('#viewToggle', tools).onclick = e => {
    view = view === 'grid' ? 'list' : 'grid';
    e.currentTarget.textContent = view === 'grid' ? '⊞' : '☰';
    render();
  };
  $('#sortBtn', tools).onclick = e => {
    sortBy = sortBy === 'name' ? 'size' : sortBy === 'size' ? 'date' : 'name';
    e.currentTarget.textContent = 'Sort: ' + sortBy;
    render();
  };

  crumbsEl.addEventListener('click', e => {
    const b = e.target.closest('[data-crumb]');
    if (!b) return;
    cwd = b.dataset.crumb || null;
    render();
  });

  gridEl.addEventListener('click', async e => {
    const act = e.target.closest('[data-rename],[data-download],[data-del]');
    if (act) {
      e.stopPropagation();
      const id = act.dataset.rename || act.dataset.download || act.dataset.del;
      const f = files.find(x => x.id === id);
      if (!f) return;
      if (act.dataset.rename) {
        const n = await promptDialog('Rename', f.name, 'Name');
        if (n) { f.name = n; save(); render(); }
      } else if (act.dataset.download) {
        let blob = null;
        if (f.blob) { try { blob = await blobs.get(bk(f)); } catch {} }
        else if (f.data) blob = await dataUrlToBlob(f.data);
        if (blob) download(f.name, blob);
        else toast(MISSING, 5000);
      } else if (act.dataset.del) {
        const gone = [f, ...(f.type === 'folder' ? descendants(f.id) : [])];
        const extra = gone.length - 1;
        const msg = f.type === 'folder' && extra
          ? `"${f.name}" and the ${extra} item${extra === 1 ? '' : 's'} inside it will be removed.`
          : `"${f.name}" will be removed.`;
        if (await confirmDialog('Delete?', msg)) {
          const ids = new Set(gone.map(x => x.id));
          files = files.filter(x => !ids.has(x.id));
          save(); render();
          const cancelPurge = deferBlobDelete(gone.filter(x => x.blob).map(bk));
          toast(`Deleted "${f.name}"`, 5000, () => {
            cancelPurge();
            files.push(...gone);
            save(); render();
          });
        }
      }
      return;
    }
    const card = e.target.closest('[data-id]');
    if (!card) return;
    const f = files.find(x => x.id === card.dataset.id);
    if (!f) return;
    if (f.type === 'folder') { cwd = f.id; render(); return; }
    const u = await fileUrl(f);
    if (!u) { toast(MISSING, 5000); return; }
    const mime = f.mime || '';
    if (/^image\//.test(mime)) modal(f.name, `<img src="${u}" style="width:100%;border-radius:10px">`);
    else if (/^video\//.test(mime)) modal(f.name, `<video src="${u}" controls autoplay style="width:100%;border-radius:10px;background:#000"></video>`);
    else if (/^audio\//.test(mime)) modal(f.name, `<audio src="${u}" controls autoplay style="width:100%"></audio>`);
    else if (mime === 'application/pdf') modal(f.name, `<iframe src="${u}" style="width:100%;height:65vh;border:0;border-radius:10px"></iframe>`);
    else modal(f.name, `<p style="margin:0 0 16px;color:var(--muted);font-size:13px">${esc(mime || 'Unknown type')} · ${esc(fmtSize(f.size))}</p>
      <a class="btn primary" href="${u}" download="${esc(f.name)}">Download</a>`);
  });

  render();

  // One-time upgrade: move any old base64 contents out of localStorage into IndexedDB.
  (async () => {
    let changed = false;
    for (const f of files) {
      if (f.type !== 'file' || f.blob !== undefined) continue;
      if (f.data) {
        try { await blobs.put(bk(f), await dataUrlToBlob(f.data)); f.blob = true; delete f.data; changed = true; } catch {}
      } else { f.blob = false; delete f.data; changed = true; }
    }
    if (changed) { save(); if (document.body.contains(root)) render(); }
    if (!vaultGcDone) {
      vaultGcDone = true;
      try { await blobs.gc('v:', new Set(files.filter(x => x.blob).map(bk))); } catch {}
    }
  })();
}

/* ==========================================================================
   12. QUILL — docs
   ========================================================================== */
function mountQuill(root, tools) {
  const KEY = 'quill:docs';
  let docs = store.get(KEY, null);
  if (!docs) {
    docs = [{ id: uid(), title: 'Untitled document', content: '<h1>Untitled document</h1><p>Start typing…</p>', time: Date.now() }];
    store.set(KEY, docs);
  }
  let activeId = docs[0].id;

  tools.innerHTML = `
    <button class="btn sm" id="newDoc">${I.plus} New</button>
    <button class="btn ghost sm" id="renameDoc">${I.edit} Rename</button>
    <button class="btn ghost sm" id="dupDoc">Duplicate</button>
    <button class="btn ghost sm" id="downloadDoc">${I.download} Download</button>
    <button class="btn ghost sm" id="printDoc">${I.print} Print</button>
    <span style="font-size:12px;color:var(--muted)" id="saveState"></span>`;

  root.innerHTML = `
    <div class="quill">
      <aside class="side">
        <div class="side-head"><div style="font-size:13px;font-weight:600">Your documents</div></div>
        <div id="docList" style="flex:1;overflow:auto"></div>
      </aside>
      <div class="main">
        <div class="toolbar">
          <button class="tb" data-cmd="bold" title="Bold"><b>B</b></button>
          <button class="tb" data-cmd="italic" title="Italic"><i>I</i></button>
          <button class="tb" data-cmd="underline" title="Underline"><u>U</u></button>
          <button class="tb" data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>
          <div class="tb-sep"></div>
          <button class="tb" data-block="h1" title="Heading 1">H1</button>
          <button class="tb" data-block="h2" title="Heading 2">H2</button>
          <button class="tb" data-block="h3" title="Heading 3">H3</button>
          <button class="tb" data-block="p" title="Paragraph">¶</button>
          <div class="tb-sep"></div>
          <button class="tb" data-cmd="insertUnorderedList" title="Bullets">•</button>
          <button class="tb" data-cmd="insertOrderedList" title="Numbered">1.</button>
          <div class="tb-sep"></div>
          <button class="tb" data-cmd="justifyLeft" title="Left">⇤</button>
          <button class="tb" data-cmd="justifyCenter" title="Center">↔</button>
          <button class="tb" data-cmd="justifyRight" title="Right">⇥</button>
          <div class="tb-sep"></div>
          <button class="tb" data-cmd="undo" title="Undo">↺</button>
          <button class="tb" data-cmd="redo" title="Redo">↻</button>
          <div class="tb-sep"></div>
          <input type="color" id="colorPick" title="Text colour" style="width:32px;height:32px;border:0;background:transparent;cursor:pointer">
          <input type="color" id="hlPick" title="Highlight" style="width:32px;height:32px;border:0;background:transparent;cursor:pointer" value="#ffff00">
        </div>
        <div class="page"><div class="paper" id="paper" contenteditable="true" spellcheck="false"></div></div>
      </div>
    </div>`;

  const listEl = $('#docList', root);
  const paper = $('#paper', root);
  const saveState = $('#saveState', tools);

  function save() { store.set(KEY, docs); flash(); }
  function flash() { saveState.textContent = 'Saved'; clearTimeout(flash._t); flash._t = setTimeout(() => saveState.textContent = '', 1200); }

  function renderList() {
    listEl.innerHTML = docs.map(d => `
      <div class="doc-item ${d.id === activeId ? 'active' : ''}" data-id="${d.id}">
        <div class="t">${esc(d.title || 'Untitled')}</div>
        <div class="d">${esc(fmtDate(d.time))}</div>
        <div class="acts">
          <button class="mini" data-dup="${d.id}" title="Duplicate">⎘</button>
          <button class="mini" data-del="${d.id}" title="Delete">×</button>
        </div>
      </div>`).join('');
  }

  function loadDoc(id) {
    const d = docs.find(x => x.id === id);
    if (!d) return;
    activeId = id;
    paper.innerHTML = d.content || '';
    renderList();
  }

  function saveCurrent() {
    const d = docs.find(x => x.id === activeId);
    if (!d) return;
    d.content = paper.innerHTML;
    const h = paper.querySelector('h1, h2, h3, p, div');
    d.title = h ? (h.textContent.trim().slice(0, 60) || 'Untitled') : 'Untitled';
    d.time = Date.now();
    save(); renderList();
  }

  let saveTimer;
  paper.addEventListener('input', () => { clearTimeout(saveTimer); saveTimer = setTimeout(saveCurrent, 700); });

  listEl.addEventListener('click', async e => {
    const act = e.target.closest('[data-dup],[data-del]');
    if (act) {
      e.stopPropagation();
      const id = act.dataset.dup || act.dataset.del;
      if (act.dataset.dup) {
        const orig = docs.find(x => x.id === id);
        const copy = { ...orig, id: uid(), title: orig.title + ' (copy)', time: Date.now() };
        docs.splice(docs.indexOf(orig) + 1, 0, copy);
        save(); loadDoc(copy.id);
      } else if (act.dataset.del) {
        if (docs.length === 1) { toast('Cannot delete the last document'); return; }
        if (await confirmDialog('Delete document?', 'This cannot be undone.')) {
          const removed = docs.find(x => x.id === id);
          const idx = docs.indexOf(removed);
          docs = docs.filter(x => x.id !== id);
          if (activeId === id) activeId = docs[0].id;
          save(); loadDoc(activeId);
          toast(`Deleted "${removed.title}"`, 5000, () => {
            docs.splice(idx, 0, removed);
            save(); renderList();
          });
        }
      }
      return;
    }
    const it = e.target.closest('[data-id]');
    if (it) loadDoc(it.dataset.id);
  });

  $$('.tb[data-cmd]', root).forEach(b => {
    b.addEventListener('mousedown', e => e.preventDefault());
    b.addEventListener('click', () => { document.execCommand(b.dataset.cmd, false, null); paper.focus(); });
  });
  $$('.tb[data-block]', root).forEach(b => {
    b.addEventListener('mousedown', e => e.preventDefault());
    b.addEventListener('click', () => { document.execCommand('formatBlock', false, b.dataset.block); paper.focus(); });
  });
  $('#colorPick', root).addEventListener('input', e => { document.execCommand('foreColor', false, e.target.value); paper.focus(); });
  $('#hlPick', root).addEventListener('input', e => { document.execCommand('hiliteColor', false, e.target.value); paper.focus(); });

  $('#newDoc', tools).onclick = () => {
    const d = { id: uid(), title: 'Untitled document', content: '<h1>Untitled document</h1><p></p>', time: Date.now() };
    docs.unshift(d); save(); loadDoc(d.id); paper.focus();
  };
  $('#renameDoc', tools).onclick = async () => {
    const d = docs.find(x => x.id === activeId); if (!d) return;
    const n = await promptDialog('Rename document', d.title, 'Title');
    if (n) { d.title = n; save(); renderList(); }
  };
  $('#dupDoc', tools).onclick = () => {
    const orig = docs.find(x => x.id === activeId); if (!orig) return;
    const copy = { ...orig, id: uid(), title: orig.title + ' (copy)', time: Date.now() };
    docs.splice(docs.indexOf(orig) + 1, 0, copy);
    save(); loadDoc(copy.id);
  };
  $('#downloadDoc', tools).onclick = () => {
    const d = docs.find(x => x.id === activeId); if (!d) return;
    download((d.title || 'document') + '.html',
      `<!doctype html><meta charset="utf-8"><title>${esc(d.title)}</title>${d.content}`,
      'text/html');
  };
  $('#printDoc', tools).onclick = () => {
    const d = docs.find(x => x.id === activeId); if (!d) return;
    const w = window.open('', '_blank');
    w.document.write(`<!doctype html><meta charset="utf-8"><title>${esc(d.title)}</title>${d.content}`);
    w.document.close();
    setTimeout(() => w.print(), 100);
  };

  loadDoc(activeId);
}

/* ==========================================================================
   13. LEDGER — sheets
   ========================================================================== */
function mountLedger(root, tools) {
  const KEY = 'ledger:sheet';
  const COLS = 12, ROWS = 40;
  let cells = store.get(KEY, {});

  tools.innerHTML = `
    <button class="btn ghost sm" id="insertRow">+ Row</button>
    <button class="btn ghost sm" id="insertCol">+ Column</button>
    <button class="btn ghost sm" id="downloadCsv">${I.download} CSV</button>
    <button class="btn ghost sm" id="clearSheet">Clear</button>`;

  function colName(i) { let s = ''; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
  const headers = [];
  for (let c = 0; c < COLS; c++) headers.push(colName(c));

  root.innerHTML = `
    <div class="ledger">
      <div class="formula-bar">
        <div class="cell-ref" id="cellRef">A1</div>
        <span class="fx">fx</span>
        <input class="formula-input" id="formulaInput" placeholder="Enter a value or formula starting with =">
      </div>
      <div class="sheet" id="sheet"></div>
    </div>`;

  const sheet = $('#sheet', root);
  const formulaInput = $('#formulaInput', root);
  const cellRef = $('#cellRef', root);
  let selected = 'A1';

  function getCell(ref) { return cells[ref] ?? ''; }
  function expandRange(a, b) {
    const m1 = a.match(/^([A-Z]+)(\d+)$/), m2 = b.match(/^([A-Z]+)(\d+)$/);
    if (!m1 || !m2) return [];
    const cStart = Math.min(colIndex(m1[1]), colIndex(m2[1]));
    const cEnd = Math.max(colIndex(m1[1]), colIndex(m2[1]));
    const rStart = Math.min(+m1[2], +m2[2]), rEnd = Math.max(+m1[2], +m2[2]);
    const out = [];
    for (let r = rStart; r <= rEnd; r++) for (let c = cStart; c <= cEnd; c++) out.push(colName(c) + r);
    return out;
  }
  function colIndex(name) { let n = 0; for (const ch of name) n = n * 26 + (ch.charCodeAt(0) - 64); return n - 1; }
  const flat = a => a.flat(Infinity);
  const nums = a => flat(a).map(v => typeof v === 'number' ? v : parseFloat(v)).filter(n => !isNaN(n));
  const FNS = {
    SUM: (...a) => nums(a).reduce((s, n) => s + n, 0),
    AVG: (...a) => { const n = nums(a); return n.length ? n.reduce((s, x) => s + x, 0) / n.length : 0; },
    MIN: (...a) => { const n = nums(a); return n.length ? Math.min(...n) : 0; },
    MAX: (...a) => { const n = nums(a); return n.length ? Math.max(...n) : 0; },
    COUNT: (...a) => nums(a).length,
    ABS: x => Math.abs(x), SQRT: x => Math.sqrt(x),
    ROUND: (n, d = 0) => Math.round(n * 10 ** d) / 10 ** d,
    POW: (x, y) => Math.pow(x, y)
  };
  function evalFormula(expr, depth = 0) {
    if (depth > 20) return '#CYCLE';
    const ctx = {
      fns: FNS,
      cell: ref => { const v = cellValue(ref, depth + 1); return typeof v === 'number' ? v : (parseFloat(v) || 0); },
      range: (a, b) => expandRange(a, b).map(r => cellValue(r, depth + 1))
    };
    try {
      const r = evalExpression(expr, ctx);
      if (Array.isArray(r)) return '#ERR';
      if (typeof r === 'number') return isFinite(r) ? Math.round(r * 1e10) / 1e10 : '#DIV/0';
      return r;
    } catch (e) { return e.message === 'DIV0' ? '#DIV/0' : e.message === 'NAME' ? '#NAME' : '#ERR'; }
  }
  // Value of a cell, evaluating formulas recursively (so formulas can reference formulas).
  function cellValue(ref, depth = 0) {
    const raw = getCell(ref);
    if (typeof raw === 'string' && raw.startsWith('=')) {
      const r = evalFormula(raw.slice(1), depth);
      return r;
    }
    const n = parseFloat(raw);
    return raw !== '' && !isNaN(n) && String(n) === String(raw).trim() ? n : raw;
  }
  function displayValue(ref) {
    return String(cellValue(ref));
  }
  function renderSheet() {
    const parts = [];
    parts.push(`<div class="cell head corner"></div>`);
    headers.forEach(h => parts.push(`<div class="cell head">${h}</div>`));
    for (let r = 1; r <= ROWS; r++) {
      parts.push(`<div class="cell rowhead">${r}</div>`);
      for (let c = 0; c < COLS; c++) {
        const ref = headers[c] + r;
        parts.push(`<div class="cell ${ref === selected ? 'selected' : ''}" data-ref="${ref}">${esc(String(displayValue(ref)))}</div>`);
      }
    }
    sheet.innerHTML = parts.join('');
  }
  function updateFormulaBar() {
    cellRef.textContent = selected;
    formulaInput.value = getCell(selected);
  }
  sheet.addEventListener('click', e => {
    const cell = e.target.closest('[data-ref]');
    if (!cell) return;
    selected = cell.dataset.ref;
    renderSheet(); updateFormulaBar();
  });
  sheet.addEventListener('dblclick', e => {
    const cell = e.target.closest('[data-ref]');
    if (cell) startEdit(cell);
  });
  function startEdit(cell) {
    const ref = cell.dataset.ref;
    selected = ref;
    const raw = getCell(ref);
    cell.classList.add('editing');
    cell.textContent = raw;
    cell.contentEditable = 'true';
    cell.focus();
    document.execCommand('selectAll', false, null);
    function commit() {
      cell.contentEditable = 'false';
      const v = cell.textContent;
      if (v === '') delete cells[ref]; else cells[ref] = v;
      store.set(KEY, cells);
      renderSheet(); updateFormulaBar();
      cell.removeEventListener('blur', commit);
    }
    cell.addEventListener('blur', commit);
    cell.addEventListener('keydown', function onKey(ev) {
      if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); cell.blur(); cell.removeEventListener('keydown', onKey); }
      if (ev.key === 'Escape') { cell.textContent = raw; cell.blur(); cell.removeEventListener('keydown', onKey); }
    });
  }
  formulaInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const v = formulaInput.value;
      if (v === '') delete cells[selected]; else cells[selected] = v;
      store.set(KEY, cells);
      renderSheet();
      formulaInput.blur();
    }
  });
  $('#insertRow', tools).onclick = () => {
    const ref = selected.match(/^([A-Z]+)(\d+)$/);
    if (!ref) return;
    const row = +ref[2];
    const newCells = {};
    for (const [k, v] of Object.entries(cells)) {
      const m = k.match(/^([A-Z]+)(\d+)$/);
      if (!m) { newCells[k] = v; continue; }
      const r = +m[2];
      newCells[m[1] + (r >= row ? r + 1 : r)] = v;
    }
    cells = newCells;
    store.set(KEY, cells);
    renderSheet(); toast('Row inserted above');
  };
  $('#insertCol', tools).onclick = () => {
    const ref = selected.match(/^([A-Z]+)(\d+)$/);
    if (!ref) return;
    const col = colIndex(ref[1]);
    const newCells = {};
    for (const [k, v] of Object.entries(cells)) {
      const m = k.match(/^([A-Z]+)(\d+)$/);
      if (!m) { newCells[k] = v; continue; }
      const c = colIndex(m[1]);
      newCells[colName(c >= col ? c + 1 : c) + m[2]] = v;
    }
    cells = newCells;
    store.set(KEY, cells);
    renderSheet(); toast('Column inserted left');
  };
  $('#downloadCsv', tools).onclick = () => {
    const rows = [];
    for (let r = 1; r <= ROWS; r++) {
      const row = [];
      for (let c = 0; c < COLS; c++) {
        const v = String(displayValue(headers[c] + r));
        row.push(/[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v);
      }
      if (row.some(v => v)) rows.push(row.join(','));
    }
    download('ledger.csv', rows.join('\n'), 'text/csv');
  };
  $('#clearSheet', tools).onclick = async () => {
    if (await confirmDialog('Clear sheet?', 'All cells will be emptied.')) {
      const backup = { ...cells };
      cells = {}; store.set(KEY, cells); renderSheet(); updateFormulaBar();
      toast('Sheet cleared', 5000, () => {
        cells = backup; store.set(KEY, cells); renderSheet(); updateFormulaBar();
      });
    }
  };
  renderSheet(); updateFormulaBar();
}

/* ==========================================================================
   14. DECK — slides
   ========================================================================== */
function mountDeck(root, tools) {
  const KEY = 'deck:slides';
  let slides = store.get(KEY, null);
  if (!slides) {
    slides = [
      { id: uid(), title: 'Welcome to Deck', body: 'A simple way to tell a story.\n\nClick any slide on the left to edit it.' },
      { id: uid(), title: 'Slide two', body: 'Use the + button to add more slides.' }
    ];
    store.set(KEY, slides);
  }
  let active = slides[0].id;
  let overlay = null;

  tools.innerHTML = `
    <button class="btn sm" id="presentBtn">Present</button>
    <button class="btn primary sm" id="addSlide">${I.plus} Slide</button>`;

  root.innerHTML = `<div class="deck" id="deckGrid"></div>`;
  const grid = $('#deckGrid', root);

  function save() { store.set(KEY, slides); }

  function render() {
    grid.innerHTML = `
      <aside class="rail" id="rail"></aside>
      <div class="stage">
        <div class="slide-edit" id="slideEdit"></div>
        <div class="stage-bar">
          <button class="btn ghost sm" data-nav="prev">◀</button>
          <span style="font-size:12px;color:var(--muted)" id="slideNum"></span>
          <button class="btn ghost sm" data-nav="next">▶</button>
          <div style="flex:1"></div>
          <button class="btn ghost sm" id="dupSlide">Duplicate</button>
          <button class="btn ghost sm" id="delSlide" style="color:#ea4335">Delete</button>
        </div>
      </div>`;
    const railEl = $('#rail', root);
    railEl.innerHTML = slides.map((s, i) => `
      <div class="slide-thumb ${s.id === active ? 'active' : ''}" data-id="${s.id}">
        <div class="t">${esc(s.title.slice(0, 40))}</div>
        <div class="b">${esc(s.body.slice(0, 80))}</div>
        <div class="num">${i + 1}</div>
      </div>`).join('');
    railEl.onclick = e => {
      const t = e.target.closest('[data-id]');
      if (t) { active = t.dataset.id; render(); }
    };
    const editEl = $('#slideEdit', root);
    const s = slides.find(x => x.id === active) || slides[0];
    editEl.innerHTML = `
      <div class="slide">
        <input class="s-title" value="${esc(s.title)}" placeholder="Title" id="stInput">
        <textarea class="s-body" placeholder="Body" id="sbInput">${esc(s.body)}</textarea>
      </div>`;
    $('#stInput', editEl).addEventListener('input', e => { s.title = e.target.value; save(); });
    $('#sbInput', editEl).addEventListener('input', e => { s.body = e.target.value; save(); });
    $('#stInput', editEl).addEventListener('blur', render);
    $('#sbInput', editEl).addEventListener('blur', render);
    $('#slideNum', root).textContent = `Slide ${slides.findIndex(x => x.id === active) + 1} of ${slides.length}`;
    $$('[data-nav]', root).forEach(b => b.onclick = () => {
      const i = slides.findIndex(x => x.id === active);
      const n = b.dataset.nav === 'prev' ? i - 1 : i + 1;
      if (n >= 0 && n < slides.length) { active = slides[n].id; render(); }
    });
    $('#dupSlide', root).onclick = () => {
      const i = slides.findIndex(x => x.id === active);
      const copy = { ...slides[i], id: uid() };
      slides.splice(i + 1, 0, copy);
      active = copy.id; save(); render();
    };
    $('#delSlide', root).onclick = async () => {
      if (slides.length <= 1) { toast('Cannot delete the last slide'); return; }
      if (!(await confirmDialog('Delete slide?', 'This cannot be undone.'))) return;
      const idx = slides.findIndex(x => x.id === active);
      const removed = slides[idx];
      slides = slides.filter(x => x.id !== active);
      active = slides[0].id; save(); render();
      toast('Slide deleted', 5000, () => {
        slides.splice(idx, 0, removed);
        save(); render();
      });
    };
  }

  function showPresent() {
    if (overlay) overlay.remove();
    const s = slides.find(x => x.id === active) || slides[0];
    overlay = document.createElement('div');
    overlay.className = 'present-overlay';
    overlay.innerHTML = `
      <div class="slide">
        <div class="s-title">${esc(s.title)}</div>
        <div class="s-body" style="white-space:pre-wrap">${esc(s.body)}</div>
      </div>
      <div class="present-hint">← → to navigate · Esc to exit</div>`;
    document.body.appendChild(overlay);
    overlay.onclick = () => exitPresent();
    document.addEventListener('keydown', presentKey);
  }
  function presentKey(e) {
    if (!overlay) { document.removeEventListener('keydown', presentKey); return; }
    const i = slides.findIndex(x => x.id === active);
    if (e.key === 'ArrowRight' && i < slides.length - 1) { active = slides[i + 1].id; showPresent(); }
    else if (e.key === 'ArrowLeft' && i > 0) { active = slides[i - 1].id; showPresent(); }
    else if (e.key === 'Escape') exitPresent();
  }
  function exitPresent() {
    if (overlay) { overlay.remove(); overlay = null; }
    document.removeEventListener('keydown', presentKey);
    render();
  }

  $('#addSlide', tools).onclick = () => {
    const s = { id: uid(), title: 'New slide', body: '' };
    slides.push(s); active = s.id; save(); render();
  };
  $('#presentBtn', tools).onclick = () => showPresent();

  render();
}

/* ==========================================================================
   15. ALMANAC — calendar
   ========================================================================== */
function mountAlmanac(root, tools) {
  const KEY = 'almanac:events';
  let events = store.get(KEY, []);
  let cursor = new Date();
  let selectedDate = isoLocal();

  tools.innerHTML = `<button class="btn primary sm" id="addEvent">${I.plus} Event</button>`;

  root.innerHTML = `
    <div class="almanac">
      <div class="cal">
        <div class="cal-head">
          <button class="icon-btn" id="prevM">‹</button>
          <div class="month" id="monthLabel"></div>
          <button class="icon-btn" id="nextM">›</button>
          <button class="btn ghost sm" id="todayBtn">Today</button>
        </div>
        <div class="weekdays"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div>
        <div class="days" id="days"></div>
      </div>
      <aside class="side" id="side"></aside>
    </div>`;

  const daysEl = $('#days', root);
  const monthLabel = $('#monthLabel', root);
  const sideEl = $('#side', root);

  function save() { store.set(KEY, events); }

  function render() {
    const y = cursor.getFullYear(), m = cursor.getMonth();
    monthLabel.textContent = cursor.toLocaleDateString([], { month: 'long', year: 'numeric' });
    const first = new Date(y, m, 1);
    const startDay = first.getDay();
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    const prevDays = new Date(y, m, 0).getDate();
    const today = isoLocal();
    const cells = [];
    for (let i = startDay - 1; i >= 0; i--) cells.push({ d: new Date(y, m - 1, prevDays - i), other: true });
    for (let d = 1; d <= daysInMonth; d++) cells.push({ d: new Date(y, m, d), other: false });
    while (cells.length < 42) { const last = cells[cells.length - 1].d; cells.push({ d: new Date(last.getFullYear(), last.getMonth(), last.getDate() + 1), other: true }); }
    daysEl.innerHTML = cells.map(c => {
      const iso = isoLocal(c.d);
      const dayEvents = events.filter(e => e.date === iso);
      return `<div class="day ${c.other ? 'other' : ''} ${iso === today ? 'today' : ''} ${iso === selectedDate ? 'selected' : ''}" data-date="${iso}">
        <div class="n">${c.d.getDate()}</div>
        ${dayEvents.slice(0, 2).map(e => `<div class="ev">${esc(e.title)}</div>`).join('')}
        ${dayEvents.length > 2 ? `<div style="font-size:10px;color:var(--muted)">+${dayEvents.length - 2}</div>` : ''}
      </div>`;
    }).join('');
    renderSide();
  }

  function renderSide() {
    const list = events.filter(e => e.date === selectedDate).sort((a, b) => a.time.localeCompare(b.time));
    sideEl.innerHTML = `
      <h3>${parseLocalISO(selectedDate).toLocaleDateString([], { weekday:'long', month:'long', day:'numeric' })}</h3>
      ${list.length ? list.map(e => `
        <div class="ev-item">
          <div class="t">${esc(e.title)}</div>
          <div class="m">${esc(e.time)}${e.note ? ' · ' + esc(e.note) : ''}</div>
          <div class="row">
            <button data-edit="${e.id}">Edit</button>
            <button class="del" data-del="${e.id}">Delete</button>
          </div>
        </div>`).join('') : `<p style="color:var(--muted);font-size:13px">No events yet.</p>`}`;
    $$('[data-edit]', sideEl).forEach(b => b.onclick = () => editEvent(events.find(x => x.id === b.dataset.edit)));
    $$('[data-del]', sideEl).forEach(b => b.onclick = async () => {
      if (await confirmDialog('Delete event?', 'This cannot be undone.')) {
        const removed = events.find(x => x.id === b.dataset.del);
        const idx = events.indexOf(removed);
        events = events.filter(x => x.id !== b.dataset.del);
        save(); render();
        toast(`Deleted "${removed.title}"`, 5000, () => {
          events.splice(idx, 0, removed); save(); render();
        });
      }
    });
  }

  function editEvent(e) {
    const isNew = !e;
    const obj = e || { id: uid(), title:'', date: selectedDate, time:'12:00', note:'' };
    modal(isNew ? 'New event' : 'Edit event',
      `<div class="fields">
        <div><label>Title</label><input class="field" id="evTitle" value="${esc(obj.title)}" placeholder="Lunch with Ada"></div>
        <div><label>Date</label><input class="field" id="evDate" type="date" value="${obj.date}"></div>
        <div><label>Time</label><input class="field" id="evTime" type="time" value="${obj.time}"></div>
        <div><label>Note (optional)</label><input class="field" id="evNote" value="${esc(obj.note || '')}"></div>
      </div>
      <div class="actions">
        <button class="btn ghost" data-x>Cancel</button>
        <button class="btn primary" data-ok>${isNew ? 'Add' : 'Save'}</button>
      </div>`,
      (back, close) => {
        $('[data-x]', back).onclick = close;
        $('[data-ok]', back).onclick = () => {
          const title = $('#evTitle', back).value.trim();
          if (!title) { toast('Add a title'); return; }
          obj.title = title;
          obj.date = $('#evDate', back).value;
          obj.time = $('#evTime', back).value;
          obj.note = $('#evNote', back).value.trim();
          if (isNew) events.push(obj);
          save();
          selectedDate = obj.date;
          close(); render();
        };
      });
  }

  daysEl.addEventListener('click', e => {
    const d = e.target.closest('[data-date]');
    if (!d) return;
    selectedDate = d.dataset.date;
    const dt = parseLocalISO(selectedDate);
    if (dt.getMonth() !== cursor.getMonth()) cursor = dt;
    render();
  });
  $('#prevM', root).onclick = () => { cursor = new Date(cursor.getFullYear(), cursor.getMonth() - 1, 1); render(); };
  $('#nextM', root).onclick = () => { cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1); render(); };
  $('#todayBtn', root).onclick = () => { cursor = new Date(); selectedDate = isoLocal(); render(); };
  $('#addEvent', tools).onclick = () => editEvent(null);
  render();
}

/* ==========================================================================
   16. MEMO — notes
   ========================================================================== */
function mountMemo(root, tools) {
  const KEY = 'memo:notes';
  let notes = store.get(KEY, [
    { id: uid(), title:'Welcome to Memo', body:'Click any note to edit.\nHover to pin or delete.', pinned:true, color:'default', time:Date.now() }
  ]);
  let search = '';
  let sortBy = 'pinned';
  const COLORS = ['default', '#f28b82', '#fbbc04', '#fff475', '#ccff90', '#a7ffeb', '#cbf0f8', '#d7aefb'];

  tools.innerHTML = `
    <input class="field" id="memoSearch" placeholder="Search notes…" style="width:180px;height:30px;font-size:12px">
    <button class="btn ghost sm" id="sortNotes">Sort: pinned</button>`;

  root.innerHTML = `
    <div class="memo">
      <div class="memo-compose">
        <input id="nTitle" placeholder="Title">
        <textarea id="nBody" placeholder="Take a note…" rows="1"></textarea>
        <div class="bar">
          <div style="display:flex;gap:6px" id="colorRow"></div>
          <button class="btn primary sm" id="addNote">Add</button>
        </div>
      </div>
      <div class="memo-grid" id="memoGrid"></div>
    </div>`;

  const gridEl = $('#memoGrid', root);
  let composeColor = 'default';

  $('#colorRow', root).innerHTML = COLORS.map(c => `
    <button class="color-dot ${c === 'default' ? 'active' : ''}" data-c="${c}"
      style="background:${c === 'default' ? 'var(--surface-2)' : c}"></button>`).join('');
  $$('.color-dot', root).forEach(b => b.onclick = () => {
    composeColor = b.dataset.c;
    $$('.color-dot', root).forEach(x => x.classList.toggle('active', x === b));
  });

  function save() { store.set(KEY, notes); }

  function render() {
    const q = search.toLowerCase();
    let sorted = [...notes].filter(n => !q || (n.title + n.body).toLowerCase().includes(q));
    sorted.sort((a, b) => {
      if (sortBy === 'pinned') return (b.pinned - a.pinned) || (b.time - a.time);
      if (sortBy === 'title') return (a.title || '').localeCompare(b.title || '');
      if (sortBy === 'oldest') return a.time - b.time;
      return b.time - a.time;
    });
    if (!sorted.length) {
      gridEl.innerHTML = `<div class="empty-state" style="columns:1"><h3>No notes</h3><p>Write one above.</p></div>`;
      return;
    }
    gridEl.innerHTML = sorted.map(n => `
      <div class="note ${n.pinned ? 'pinned' : ''}" data-id="${n.id}"
        style="${n.color && n.color !== 'default' ? 'background:' + n.color + ';' : ''}">
        <button class="pin" data-pin="${n.id}" title="${n.pinned ? 'Unpin' : 'Pin'}">📌</button>
        <div class="nt">${esc(n.title || 'Untitled')}</div>
        <div class="nb">${esc(n.body)}</div>
        <div class="nd">${esc(fmtDate(n.time))}</div>
      </div>`).join('');
  }

  $('#memoSearch', tools).addEventListener('input', e => { search = e.target.value; render(); });
  $('#sortNotes', tools).onclick = e => {
    sortBy = sortBy === 'pinned' ? 'newest' : sortBy === 'newest' ? 'oldest' : sortBy === 'oldest' ? 'title' : 'pinned';
    e.currentTarget.textContent = 'Sort: ' + sortBy;
    render();
  };

  gridEl.addEventListener('click', async e => {
    const pin = e.target.closest('[data-pin]');
    if (pin) { e.stopPropagation(); const n = notes.find(x => x.id === pin.dataset.pin); if (n) { n.pinned = !n.pinned; save(); render(); } return; }
    const card = e.target.closest('[data-id]');
    if (!card) return;
    const n = notes.find(x => x.id === card.dataset.id);
    if (!n) return;
    modal('Edit note',
      `<div class="fields">
        <div><label>Title</label><input class="field" id="eT" value="${esc(n.title)}"></div>

/* ==========================================================================
   17. ERRAND — tasks
   ========================================================================== */
function mountErrand(root, tools) {
  const KEY = 'errand:data';
  let data = store.get(KEY, {
    lists: [{ id: 'default', name: 'My tasks' }],
    tasks: [
      { id: uid(), list:'default', text:'Try every app in Spageti', done:false, due:'' },
      { id: uid(), list:'default', text:'Write a note in Memo', done:false, due:'' }
    ]
  });
  let activeList = data.lists[0].id;

  tools.innerHTML = `
    <button class="btn ghost sm" id="clearDone">Clear completed</button>
    <button class="btn primary sm" id="newList">${I.plus} New list</button>`;

  function save() { store.set(KEY, data); }

  root.innerHTML = `
    <div class="errand">
      <aside class="rail">
        <h3>Lists</h3>
        <div id="listRail"></div>
      </aside>
      <div class="main">
        <h1 id="listTitle"></h1>
        <div id="taskList"></div>
        <div class="add">
          <input class="field" id="taskInput" placeholder="Add a task…">
          <input class="field" id="taskDue" type="date" style="max-width:160px">
          <button class="btn primary" id="addTask">Add</button>
        </div>
      </div>
    </div>`;

  const railEl = $('#listRail', root);
  const listEl = $('#taskList', root);
  const titleEl = $('#listTitle', root);

  function render() {
    railEl.innerHTML = data.lists.map(l => {
      const c = data.tasks.filter(t => t.list === l.id && !t.done).length;
      return `<div class="list-item ${l.id === activeList ? 'active' : ''}" data-id="${l.id}">
        <span>📋</span> ${esc(l.name)}
        ${c ? `<span class="count">${c}</span>` : ''}
        <div class="acts">
          <button class="mini" data-lren="${l.id}" title="Rename">✎</button>
          ${data.lists.length > 1 ? `<button class="mini" data-ldel="${l.id}" title="Delete">×</button>` : ''}
        </div>
      </div>`;
    }).join('');

    const list = data.lists.find(l => l.id === activeList);
    titleEl.innerHTML = `${esc(list ? list.name : 'Tasks')}
      <button class="mini" id="renameListTop" style="border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:14px;padding:4px 8px;border-radius:6px">✎</button>`;

    const tasks = data.tasks.filter(t => t.list === activeList).sort((a, b) => a.done - b.done);
    listEl.innerHTML = tasks.length ? tasks.map(t => `
      <div class="task ${t.done ? 'done' : ''}" data-id="${t.id}">
        <input type="checkbox" ${t.done ? 'checked' : ''} data-check="${t.id}">
        <div class="txt">${esc(t.text)}</div>
        ${t.due ? `<div class="due">${esc(t.due)}</div>` : ''}
        <button class="mini" data-tedit="${t.id}" title="Edit">✎</button>
        <button class="mini del" data-del="${t.id}" title="Delete">×</button>
      </div>`).join('') : `<p style="color:var(--muted);font-size:13px;padding:20px 0">Nothing to do. Enjoy!</p>`;

    $('#renameListTop', titleEl).onclick = () => {
      const l = data.lists.find(x => x.id === activeList); if (!l) return;
      promptDialog('Rename list', l.name, 'Name').then(n => { if (n) { l.name = n; save(); render(); } });
    };
  }

  railEl.addEventListener('click', async e => {
    const act = e.target.closest('[data-lren],[data-ldel]');
    if (act) {
      e.stopPropagation();
      const id = act.dataset.lren || act.dataset.ldel;
      const l = data.lists.find(x => x.id === id);
      if (!l) return;
      if (act.dataset.lren) {
        const n = await promptDialog('Rename list', l.name, 'Name');
        if (n) { l.name = n; save(); render(); }
      } else if (act.dataset.ldel) {
        if (data.lists.length <= 1) { toast('Keep at least one list'); return; }
        if (await confirmDialog('Delete list?', `"${l.name}" and its tasks will be removed.`)) {
          const removedList = l;
          const removedTasks = data.tasks.filter(t => t.list === id);
          data.lists = data.lists.filter(x => x.id !== id);
          data.tasks = data.tasks.filter(t => t.list !== id);
          if (activeList === id) activeList = data.lists[0].id;
          save(); render();
          toast(`Deleted "${l.name}"`, 5000, () => {
            data.lists.push(removedList);
            data.tasks.push(...removedTasks);
            save(); render();
          });
        }
      }
      return;
    }
    const it = e.target.closest('[data-id]');
    if (it) { activeList = it.dataset.id; render(); }
  });

  listEl.addEventListener('click', async e => {
    const c = e.target.closest('[data-check]');
    if (c) { const t = data.tasks.find(x => x.id === c.dataset.check); if (t) { t.done = c.checked; save(); render(); } return; }
    const ed = e.target.closest('[data-tedit]');
    if (ed) {
      e.stopPropagation();
      const t = data.tasks.find(x => x.id === ed.dataset.tedit); if (!t) return;
      modal('Edit task',
        `<div class="fields">
          <div><label>Task</label><input class="field" id="tText" value="${esc(t.text)}"></div>
          <div><label>Due</label><input class="field" id="tDue" type="date" value="${t.due || ''}"></div>
        </div>
        <div class="actions">
          <button class="btn ghost" data-x>Cancel</button>
          <button class="btn primary" data-ok>Save</button>
        </div>`,
        (back, close) => {
          $('[data-x]', back).onclick = close;
          $('[data-ok]', back).onclick = () => {
            t.text = $('#tText', back).value.trim() || t.text;
            t.due = $('#tDue', back).value;
            save(); close(); render();
          };
        });
      return;
    }
    const d = e.target.closest('[data-del]');
    if (d) {
      const t = data.tasks.find(x => x.id === d.dataset.del);
      const idx = data.tasks.indexOf(t);
      data.tasks = data.tasks.filter(x => x.id !== d.dataset.del);
      save(); render();
      toast('Task deleted', 5000, () => { data.tasks.splice(idx, 0, t); save(); render(); });
    }
  });

  function addTask() {
    const text = $('#taskInput', root).value.trim();
    if (!text) return;
    data.tasks.push({ id: uid(), list: activeList, text, done: false, due: $('#taskDue', root).value });
    save();
    $('#taskInput', root).value = ''; $('#taskDue', root).value = '';
    render();
  }
  $('#addTask', root).onclick = addTask;
  $('#taskInput', root).addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });

  $('#newList', tools).onclick = async () => {
    const n = await promptDialog('New list', '', 'Name');
    if (!n) return;
    data.lists.push({ id: uid(), name: n });
    activeList = data.lists[data.lists.length - 1].id;
    save(); render();
  };
  $('#clearDone', tools).onclick = async () => {
    const n = data.tasks.filter(t => t.list === activeList && t.done).length;
    if (!n) { toast('No completed tasks'); return; }
    if (await confirmDialog('Clear completed?', `Remove ${n} completed task${n === 1 ? '' : 's'}.`)) {
      const removed = data.tasks.filter(t => t.list === activeList && t.done);
      data.tasks = data.tasks.filter(t => !(t.list === activeList && t.done));
      save(); render();
      toast(`Cleared ${removed.length} task${removed.length === 1 ? '' : 's'}`, 5000, () => {
        data.tasks.push(...removed); save(); render();
      });
    }
  };

  render();
}

/* ==========================================================================

function mountRolodex(root, tools) {
  const KEY = 'rolodex:contacts';
  let contacts = store.get(KEY, [
    { id:uid(), name:'Ada Lovelace', email:'ada@analytical.engine', phone:'+44 20 7946 0000', note:'Mathematician, first programmer', favorite:true, time:Date.now() },
    { id:uid(), name:'Alan Turing', email:'alan@bletchley.uk', phone:'+44 20 7946 0001', note:'Computer scientist', favorite:false, time:Date.now() }
  ]);
  let activeId = contacts[0]?.id || null;
  let query = '';

  tools.innerHTML = `
    <button class="btn ghost sm" id="exportBtn">⬇ Export</button>
    <button class="btn ghost sm" id="importBtn">⬆ Import</button>
    <button class="btn primary sm" id="addContact">${I.plus} Contact</button>`;

  root.innerHTML = `
    <div class="rolodex">
      <div class="list">
        <div class="list-head"><input class="field" id="search" placeholder="Search contacts…"></div>
        <div id="contactList"></div>
      </div>
      <div class="detail" id="detail"></div>
    </div>`;

  const listEl = $('#contactList', root);
  const detailEl = $('#detail', root);

  function save() { store.set(KEY, contacts); }
  function initials(n) { return n.split(' ').map(w => w[0]).slice(0,2).join('').toUpperCase(); }
  function avatarColor(n) { const hue = [...n].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 0); return `hsl(${hue} 55% 50%)`; }

  function render() {
    const filtered = contacts
      .filter(c => !query || (c.name + c.email + (c.phone||'')).toLowerCase().includes(query))
      .sort((a, b) => (b.favorite - a.favorite) || a.name.localeCompare(b.name));
    if (!filtered.length) {
      listEl.innerHTML = `<div class="empty-state" style="padding:30px"><p>No contacts.</p></div>`;
    } else {
      listEl.innerHTML = filtered.map(c => `
        <div class="contact-row ${c.id === activeId ? 'active' : ''}" data-id="${c.id}">
          <div class="av" style="background:${avatarColor(c.name)}">${esc(initials(c.name))}</div>
          <div class="info">
            <div class="n">${esc(c.name)}</div>
            <div class="e">${esc(c.email)}</div>
          </div>
          ${c.favorite ? '<span class="fav">★</span>' : ''}
        </div>`).join('');
    }
    const c = contacts.find(x => x.id === activeId);
    if (!c) {
      detailEl.innerHTML = `<div class="empty-state"><h3>No contact selected</h3><p>Pick one, or add a new contact.</p></div>`;
      return;
    }
    detailEl.innerHTML = `
      <div class="hero">
        <div class="av-lg" style="background:${avatarColor(c.name)}">${esc(initials(c.name))}</div>
        <div>
          <h1>${esc(c.name)}</h1>
          <div class="sub">${esc(c.email)}</div>
        </div>
        <div style="margin-left:auto;display:flex;gap:6px">
          <button class="btn ghost sm" data-fav>${c.favorite ? '★ Favourited' : '☆ Favourite'}</button>
          <button class="btn ghost sm" data-edit>Edit</button>
          <button class="btn ghost sm danger" data-del>Delete</button>
        </div>
      </div>
      <div class="field-row"><div class="label">Email</div><div>${esc(c.email)}</div></div>
      ${c.phone ? `<div class="field-row"><div class="label">Phone</div><div>${esc(c.phone)}</div></div>` : ''}
      ${c.note ? `<div class="field-row"><div class="label">Note</div><div>${esc(c.note)}</div></div>` : ''}
      <div class="field-row"><div class="label">Added</div><div>${esc(fmtDate(c.time))}</div></div>`;
    $('[data-fav]', detailEl).onclick = () => { c.favorite = !c.favorite; save(); render(); };
    $('[data-edit]', detailEl).onclick = () => editContact(c);
    $('[data-del]', detailEl).onclick = async () => {
      if (await confirmDialog('Delete contact?', `"${c.name}" will be removed.`)) {
        const idx = contacts.indexOf(c);
        contacts = contacts.filter(x => x.id !== c.id);
        activeId = contacts[0]?.id || null;
        save(); render();
        toast(`Deleted "${c.name}"`, 5000, () => { contacts.splice(idx, 0, c); save(); render(); });
      }
    };
  }

  listEl.addEventListener('click', e => {
    const r = e.target.closest('[data-id]');
    if (r) { activeId = r.dataset.id; render(); }
  });
  $('#search', root).addEventListener('input', e => { query = e.target.value.toLowerCase(); render(); });

  function editContact(c) {
    const isNew = !c;
    const obj = c || { id: uid(), name:'', email:'', phone:'', note:'', favorite:false, time: Date.now() };
    modal(isNew ? 'New contact' : 'Edit contact',
      `<div class="fields">
        <div><label>Name</label><input class="field" id="cN" value="${esc(obj.name)}"></div>
        <div><label>Email</label><input class="field" id="cE" value="${esc(obj.email)}"></div>
        <div><label>Phone</label><input class="field" id="cP" value="${esc(obj.phone || '')}"></div>
        <div><label>Note</label><input class="field" id="cO" value="${esc(obj.note || '')}"></div>
      </div>
      <div class="actions">
        <button class="btn ghost" data-x>Cancel</button>
        <button class="btn primary" data-ok>Save</button>
      </div>`,
      (back, close) => {
        $('[data-x]', back).onclick = close;
        $('[data-ok]', back).onclick = () => {
          obj.name = $('#cN', back).value.trim();
          obj.email = $('#cE', back).value.trim();
          obj.phone = $('#cP', back).value.trim();
          obj.note = $('#cO', back).value.trim();
          if (!obj.name) { toast('Name is required'); return; }
          if (isNew) contacts.push(obj);
          save(); close(); activeId = obj.id; render();
        };
      });
  }

  $('#addContact', tools).onclick = () => editContact(null);
  $('#exportBtn', tools).onclick = () => download('rolodex.json', JSON.stringify(contacts, null, 2), 'application/json');
  $('#importBtn', tools).onclick = () => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = () => {
      const f = inp.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const data = JSON.parse(r.result);
          if (!Array.isArray(data)) throw new Error('Expected an array');
          const incoming = data.filter(x => x && x.name).map(x => ({
            id: uid(), name: String(x.name), email: String(x.email || ''), phone: String(x.phone || ''),
            note: String(x.note || ''), favorite: !!x.favorite, time: x.time || Date.now() }));
          contacts = [...contacts, ...incoming];
          save(); render(); toast(`Imported ${incoming.length} contacts`);
        } catch (e) { toast('Invalid file: ' + e.message); }
      };
      r.readAsText(f);
    };
    inp.click();
  };

  render();
}

/* ==========================================================================
   19. ABACUS — calculator
   ========================================================================== */
function mountAbacus(root, tools) {
  const KEY = 'abacus:history';
  let history = store.get(KEY, []);
  let expr = '';

  root.innerHTML = `
    <div class="abacus">
      <div class="calc">
        <div class="display">
          <button class="copy" id="copyResult" title="Copy result">📋 Copy</button>
          <div class="expr" id="exprDisp"></div>
          <div class="result" id="resultDisp">0</div>
        </div>
        <div class="keys" id="keys"></div>
      </div>
      <aside class="history">
        <h3>History <button id="clearHist">Clear</button></h3>
        <div id="histList"></div>
      </aside>
    </div>`;

  const keys = [
    { k:'C', cls:'fn' }, { k:'(', cls:'fn' }, { k:')', cls:'fn' }, { k:'÷', cls:'op', v:'/' },
    { k:'7' }, { k:'8' }, { k:'9' }, { k:'×', cls:'op', v:'*' },
    { k:'4' }, { k:'5' }, { k:'6' }, { k:'−', cls:'op', v:'-' },
    { k:'1' }, { k:'2' }, { k:'3' }, { k:'+', cls:'op', v:'+' },
    { k:'±', cls:'fn' }, { k:'0' }, { k:'.' }, { k:'=', cls:'eq' }
  ];

  $('#keys', root).innerHTML = keys.map(k =>
    `<button class="key ${k.cls || ''}" data-k="${esc(k.k)}" data-v="${esc(k.v || k.k)}">${esc(k.k)}</button>`
  ).join('');

  const exprDisp = $('#exprDisp', root);
  const resultDisp = $('#resultDisp', root);

  function safeEval(s) {
    if (!s) return '';
    try {
      const r = evalExpression(s, {});
      if (typeof r !== 'number' || !isFinite(r)) return 'Error';
      return String(Math.round(r * 1e12) / 1e12);
    } catch { return 'Error'; }
  }
  function updateDisplay() {
    exprDisp.textContent = expr;
    if (!expr) { resultDisp.textContent = '0'; return; }
    const r = safeEval(expr);
    resultDisp.textContent = r || '0';
  }
  function renderHistory() {
    const el = $('#histList', root);
    if (!history.length) { el.innerHTML = `<p style="color:var(--muted);font-size:12px">Nothing yet.</p>`; return; }
    el.innerHTML = history.map((h, i) => `
      <div class="h-item" data-i="${i}">
        <div class="e">${esc(h.e)}</div>
        <div class="r">= ${esc(h.r)}</div>
      </div>`).join('');
    $$('[data-i]', el).forEach(it => it.onclick = () => { expr = history[+it.dataset.i].r; updateDisplay(); });
  }
  function press(k, v) {
    if (k === 'C') { expr = ''; updateDisplay(); return; }
    if (k === '=') {
      const r = safeEval(expr);
      if (r && r !== 'Error') {
        history.unshift({ e: expr, r });
        if (history.length > 30) history.pop();
        store.set(KEY, history);
        renderHistory();
        expr = r;
      }
      updateDisplay();
      return;
    }
    if (k === '±') {
      if (!expr) return;
      expr = expr.startsWith('-') ? expr.slice(1) : '-' + expr;
      updateDisplay();
      return;
    }
    expr += v;
    updateDisplay();
  }

  $('#keys', root).addEventListener('click', e => {
    const b = e.target.closest('[data-k]');
    if (b) press(b.dataset.k, b.dataset.v);
  });
  $('#copyResult', root).onclick = () => {
    navigator.clipboard.writeText(resultDisp.textContent);
    toast('Copied');
  };
  $('#clearHist', root).onclick = async () => {
    if (await confirmDialog('Clear history?', 'All calculation history will be erased.')) {
      const backup = [...history];
      history = []; store.set(KEY, history); renderHistory();
      toast('History cleared', 5000, () => { history = backup; store.set(KEY, history); renderHistory(); });
    }
  };

  function calcKeys(e) {
    if (!document.body.contains(root)) {
      document.removeEventListener('keydown', calcKeys);
      return;
    }
    if (isTyping()) return;
    const k = e.key;
    if (/^[0-9.]$/.test(k)) { expr += k; updateDisplay(); }
    else if ('+-*/()'.includes(k)) { expr += k; updateDisplay(); }
    else if (k === 'Enter' || k === '=') { e.preventDefault(); press('=', '='); }
    else if (k === 'Backspace') { expr = expr.slice(0, -1); updateDisplay(); }
    else if (k === 'Escape') { expr = ''; updateDisplay(); }
  }
  document.addEventListener('keydown', calcKeys);
  const cleanup = new MutationObserver(() => {
    if (!document.body.contains(root)) {
      document.removeEventListener('keydown', calcKeys);
      cleanup.disconnect();
    }
  });
  cleanup.observe(document.body, { childList: true, subtree: true });

  updateDisplay(); renderHistory();
}

          <div style="display:flex;gap:8px;justify-content:center">
            <button class="btn primary" id="swStart">Start</button>
            <button class="btn" id="swLap">Lap</button>
            <button class="btn ghost" id="swReset">Reset</button>
          </div>
          <div class="laps" id="swLaps"></div>
        </div>
      </div>
    </div>`;

  $$('.tab', root).forEach(t => t.onclick = () => {
    $$('.tab', root).forEach(x => x.classList.toggle('active', x === t));
    $$('.panel', root).forEach(p => p.classList.toggle('active', p.id === 'panel-' + t.dataset.p));
  });

  const worldGrid = $('#worldGrid', root);
  function saveCities() { store.set(KEY, cities); }
  function renderWorld() {
    worldGrid.innerHTML = cities.map(c => `
      <div class="world-clock" data-id="${c.id}">
        <div class="city">${esc(c.name)}</div>
        <div class="time" data-tz="${c.tz}">--:--</div>
        <div class="date" data-tzd="${c.tz}"></div>
        <button class="del" data-delcity="${c.id}" title="Remove">×</button>
      </div>`).join('');
  }
  worldGrid.addEventListener('click', e => {
    const d = e.target.closest('[data-delcity]');
    if (d) { cities = cities.filter(x => x.id !== d.dataset.delcity); saveCities(); renderWorld(); }
  });
  $('#addCity', root).onclick = async () => {
    const q = $('#cityInput', root).value.trim();
    if (!q) return;
    try {
      const g = await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&name=' + encodeURIComponent(q)).then(r => r.json());
      if (!g.results || !g.results.length) { toast('City not found'); return; }
      const p = g.results[0];
      cities.push({ id: uid(), name: p.name + (p.country ? ', ' + p.country : ''), tz: p.timezone });
      saveCities(); renderWorld();
      $('#cityInput', root).value = '';
    } catch { toast('Lookup failed'); }
  };
  $('#cityInput', root).addEventListener('keydown', e => { if (e.key === 'Enter') $('#addCity', root).click(); });
  renderWorld();

  function tick() {
    if (!document.body.contains(root)) return;
    const now = new Date();
    const lt = $('#localTime', root); if (lt) lt.textContent = now.toLocaleTimeString([], { hour12:false });
    const ld = $('#localDate', root); if (ld) ld.textContent = now.toLocaleDateString([], { weekday:'long', month:'long', day:'numeric', year:'numeric' });
    $$('[data-tz]', worldGrid).forEach(el => {
      try { el.textContent = now.toLocaleTimeString([], { timeZone: el.dataset.tz, hour:'2-digit', minute:'2-digit', hour12:false }); }
      catch { el.textContent = '--:--'; }
    });
    $$('[data-tzd]', worldGrid).forEach(el => {
      try { el.textContent = now.toLocaleDateString([], { timeZone: el.dataset.tzd, weekday:'short', month:'short', day:'numeric' }); }
      catch {}
    });
    setTimeout(tick, 1000);
  }
  tick();

  let timerRemaining = 0, timerInterval = null, timerRunning = false;
  const tDisp = $('#timerDisp', root);
  function fmtTimer(ms) {
    const s = Math.max(0, Math.floor(ms/1000));
    return String(Math.floor(s/3600)).padStart(2,'0') + ':' + String(Math.floor(s/60)%60).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
  }
  function updTimer() { tDisp.textContent = fmtTimer(timerRemaining); }
  $('#tStart', root).onclick = () => {
    if (timerRunning) return;
    if (!timerRemaining) {
      const h = +$('#tH', root).value || 0, m = +$('#tM', root).value || 0, s = +$('#tS', root).value || 0;
      timerRemaining = ((h*60 + m)*60 + s) * 1000;
      if (!timerRemaining) { toast('Set a time'); return; }
    }
    const end = Date.now() + timerRemaining;
    timerRunning = true;
    timerInterval = setInterval(() => {
      timerRemaining = end - Date.now();
      if (timerRemaining <= 0) { clearInterval(timerInterval); timerRunning = false; timerRemaining = 0; updTimer(); beep(); toast('Time is up!'); }
      else updTimer();
    }, 200);
  };
  $('#tPause', root).onclick = () => { clearInterval(timerInterval); timerRunning = false; };
  $('#tReset', root).onclick = () => { clearInterval(timerInterval); timerRunning = false; timerRemaining = 0; updTimer(); };
  updTimer();

  let swTime = 0, swLast = 0, swInterval = null, swRunning = false, laps = [];
  const swDisp = $('#swDisp', root);
  function fmtSw(ms) {
    const s = Math.floor(ms/1000);
    return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0') + '.' + String(Math.floor((ms%1000)/10)).padStart(2,'0');
  }
  function updSw() { swDisp.textContent = fmtSw(swTime); }
  $('#swStart', root).onclick = () => {
    if (swRunning) { clearInterval(swInterval); swRunning = false; $('#swStart', root).textContent = 'Start'; }
    else { swRunning = true; swLast = Date.now() - swTime; swInterval = setInterval(() => { swTime = Date.now() - swLast; updSw(); }, 30); $('#swStart', root).textContent = 'Stop'; }
  };
  $('#swLap', root).onclick = () => { if (!swRunning && swTime === 0) return; laps.push(swTime); renderLaps(); };
  $('#swReset', root).onclick = () => { clearInterval(swInterval); swRunning = false; swTime = 0; laps = []; updSw(); renderLaps(); $('#swStart', root).textContent = 'Start'; };
  function renderLaps() {
    const el = $('#swLaps', root);
    el.innerHTML = laps.slice().reverse().map((t, i) => {
      const n = laps.length - i;
      const prev = n > 1 ? laps[n - 2] : 0;
      return `<div class="lap-row"><span>Lap ${n}</span><span>${fmtSw(t - prev)}</span><span style="color:var(--muted)">${fmtSw(t)}</span></div>`;
    }).join('');
  }
  updSw();

  function beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 800; g.gain.value = 0.15;
      o.start(); setTimeout(() => { o.stop(); ctx.close(); }, 400);
    } catch {}
  }
}

/* ==========================================================================
   21. BAROMETER — weather
   ========================================================================== */
function mountBarometer(root, tools) {
  const KEY = 'barometer:state';
  let state = store.get(KEY, { city: 'London', unit: 'C' });

  tools.innerHTML = `
    <button class="btn ghost sm" id="myLocBtn">${I.location} My location</button>
    <button class="btn ghost sm" id="unitBtn">°${state.unit}</button>`;

  root.innerHTML = `
    <div class="barometer">
      <div class="search-row">
        <input class="field" id="cityInput" placeholder="Search a city…" value="${esc(state.city)}">
        <button class="btn primary" id="goBtn">Go</button>
      </div>
      <div id="weatherOut"></div>
    </div>`;

  const out = $('#weatherOut', root);
  function save() { store.set(KEY, state); }

  const WMO = { 0:['Clear sky','☀️'], 1:['Mainly clear','🌤'], 2:['Partly cloudy','⛅'], 3:['Overcast','☁️'],
    45:['Fog','🌫'], 48:['Rime fog','🌫'], 51:['Light drizzle','🌦'], 53:['Drizzle','🌦'], 55:['Heavy drizzle','🌧'],
    61:['Light rain','🌧'], 63:['Rain','🌧'], 65:['Heavy rain','🌧'], 71:['Light snow','🌨'], 73:['Snow','🌨'], 75:['Heavy snow','❄️'],
    80:['Rain showers','🌦'], 81:['Showers','🌧'], 82:['Violent showers','⛈'], 95:['Thunderstorm','⛈'], 96:['Thunder + hail','⛈'], 99:['Severe storm','⛈'] };
  function desc(code) { return WMO[code] || ['—','🌡']; }
  function conv(c) { return state.unit === 'F' ? Math.round(c * 9/5 + 32) : Math.round(c); }

  async function loadByCity(city) {
    out.innerHTML = `<div class="stats" style="text-align:center"><span class="spinner"></span>Loading weather…</div>`;
    try {
      const g = await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&name=' + encodeURIComponent(city)).then(r => r.json());
      if (!g.results || !g.results.length) { out.innerHTML = `<div class="empty-state"><h3>City not found</h3><p>Try a different name.</p></div>`; return; }
      const place = g.results[0];
      state.city = place.name; save();
      await loadCoords(place.latitude, place.longitude, place.name + (place.country ? ', ' + place.country : ''));
    } catch (e) { out.innerHTML = `<div class="empty-state"><h3>Couldn't load weather</h3><p>${esc(e.message || '')}</p></div>`; }
  }

  async function loadCoords(lat, lon, label) {
    out.innerHTML = `<div class="stats" style="text-align:center"><span class="spinner"></span>Loading weather…</div>`;
    try {
      const w = await fetch(
        `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
        `&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m` +
        `&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto`
      ).then(r => r.json());
      const c = w.current;
      const [cond, icon] = desc(c.weather_code);
      const unitLabel = '°' + state.unit;
      out.innerHTML = `
        <div class="weather-card">
          <div class="icon">${icon}</div>
          <div class="city">${esc(label)}</div>
          <div class="cond">${esc(cond)}</div>
          <div class="temp">${conv(c.temperature_2m)}${unitLabel}</div>
          <div class="meta">
            <div>Feels like ${conv(c.apparent_temperature)}${unitLabel}</div>
            <div>Humidity ${c.relative_humidity_2m}%</div>
            <div>Wind ${Math.round(c.wind_speed_10m)} km/h</div>
          </div>
        </div>
        <div class="forecast">
          ${w.daily.time.slice(0, 7).map((d, i) => {
            const [c2, i2] = desc(w.daily.weather_code[i]);
            const day = new Date(d).toLocaleDateString([], { weekday:'short' });
            return `<div class="fc-day" title="${c2}">
              <div class="d">${day}</div>
              <div class="i">${i2}</div>
              <div class="hi">${conv(w.daily.temperature_2m_max[i])}°</div>
              <div class="lo">${conv(w.daily.temperature_2m_min[i])}°</div>
            </div>`;
          }).join('')}
        </div>`;
    } catch (e) { out.innerHTML = `<div class="empty-state"><h3>Couldn't load weather</h3><p>${esc(e.message || '')}</p></div>`; }
  }

  $('#goBtn', root).onclick = () => { const v = $('#cityInput', root).value.trim(); if (v) loadByCity(v); };
  $('#cityInput', root).addEventListener('keydown', e => { if (e.key === 'Enter') { const v = e.target.value.trim(); if (v) loadByCity(v); } });
  $('#unitBtn', tools).onclick = e => {
    state.unit = state.unit === 'C' ? 'F' : 'C';
    save();
    e.currentTarget.textContent = '°' + state.unit;
    loadByCity(state.city);
  };
  $('#myLocBtn', tools).onclick = () => {
    if (!navigator.geolocation) { toast('Geolocation not supported'); return; }
    out.innerHTML = `<div class="stats" style="text-align:center"><span class="spinner"></span>Locating…</div>`;
    navigator.geolocation.getCurrentPosition(
      p => loadCoords(p.coords.latitude, p.coords.longitude, 'Your location'),
      () => { toast('Location denied'); loadByCity(state.city); }
    );
  };

  loadByCity(state.city);
}

/* ==========================================================================
   22. POLYGLOT — translate
   ========================================================================== */
function mountPolyglot(root, tools) {
  const LANGS = [
    ['en','English'], ['es','Spanish'], ['fr','French'], ['de','German'],
    ['it','Italian'], ['pt','Portuguese'], ['ru','Russian'], ['ja','Japanese'],
    ['ko','Korean'], ['zh','Chinese'], ['ar','Arabic'], ['hi','Hindi'],
    ['nl','Dutch'], ['sv','Swedish'], ['tr','Turkish'], ['pl','Polish']
  ];

  root.innerHTML = `
    <div class="polyglot">
      <div class="bar">
        <select id="srcLang">${LANGS.map(([c, n]) => `<option value="${c}">${n}</option>`).join('')}</select>
        <button class="icon-btn" id="swapBtn" title="Swap languages">⇄</button>
        <select id="dstLang">${LANGS.map(([c, n]) => `<option value="${c}" ${c === 'es' ? 'selected' : ''}>${n}</option>`).join('')}</select>
        <div style="flex:1"></div>
        <button class="btn ghost" id="clearBtn">Clear</button>
        <button class="btn primary" id="trBtn">Translate</button>
      </div>
      <div class="panes">
        <div class="pane">
          <div class="pane-head">
            <span>From</span>
            <span>
              <button class="btn ghost sm" id="speakSrc" title="Listen">🔊</button>
              <span id="charCount">0 / 500</span>
            </span>
          </div>
          <textarea id="srcText" placeholder="Type something to translate…" maxlength="500"></textarea>
        </div>
        <div class="pane">
          <div class="pane-head">
            <span>To</span>
            <span>
              <button class="btn ghost sm" id="speakDst" title="Listen">🔊</button>
              <button class="btn ghost sm" id="copyBtn" style="display:none">Copy</button>
            </span>
          </div>
          <div class="out" id="dstText"></div>
        </div>
      </div>
    </div>`;

  const srcText = $('#srcText', root);
  const dstText = $('#dstText', root);
  const charCount = $('#charCount', root);
  const copyBtn = $('#copyBtn', root);

  srcText.addEventListener('input', () => charCount.textContent = srcText.value.length + ' / 500');

  async function translate() {
    const text = srcText.value.trim();
    if (!text) return;
    const src = $('#srcLang', root).value;
    const dst = $('#dstLang', root).value;
    dstText.innerHTML = `<span class="spinner"></span>Translating…`;
    try {
      const r = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=' + src + '|' + dst);
      const j = await r.json();
      const t = j?.responseData?.translatedText || '';
      dstText.textContent = t || 'No translation';
      copyBtn.style.display = t ? 'inline-flex' : 'none';
    } catch (e) { dstText.textContent = 'Translation failed: ' + (e.message || 'unknown error'); }
  }

  $('#trBtn', root).onclick = translate;
  $('#clearBtn', root).onclick = () => { srcText.value = ''; dstText.textContent = ''; charCount.textContent = '0 / 500'; copyBtn.style.display = 'none'; srcText.focus(); };
  $('#swapBtn', root).onclick = () => {
    const a = $('#srcLang', root).value, b = $('#dstLang', root).value;
    $('#srcLang', root).value = b; $('#dstLang', root).value = a;
    const cur = srcText.value;
    if (dstText.textContent) {
      srcText.value = dstText.textContent;
      dstText.textContent = cur;
      charCount.textContent = srcText.value.length + ' / 500';
    }
  };
  copyBtn.onclick = () => { navigator.clipboard.writeText(dstText.textContent); toast('Copied'); };
  function speak(text, lang) {
    if (!text || !window.speechSynthesis) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }
  $('#speakSrc', root).onclick = () => speak(srcText.value, $('#srcLang', root).value);
  $('#speakDst', root).onclick = () => speak(dstText.textContent, $('#dstLang', root).value);
  srcText.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) translate(); });
}
