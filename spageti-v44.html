   23. BULLETIN — news
   ========================================================================== */
function mountBulletin(root, tools) {
  const SAVE_KEY = 'bulletin:saved';
  let saved = store.get(SAVE_KEY, []).map(x => typeof x === 'number' ? { id: x, title: 'Item #' + x, url: 'https://news.ycombinator.com/item?id=' + x } : x);

  tools.innerHTML = `
    <button class="btn ghost sm" id="savedBtn">★ Saved (${saved.length})</button>
    <button class="btn ghost sm" id="refreshBtn">↻ Refresh</button>`;

  root.innerHTML = `
    <div class="bulletin">
      <div class="tabs">
        <button class="tab active" data-t="topstories">Top</button>
        <button class="tab" data-t="newstories">New</button>
        <button class="tab" data-t="beststories">Best</button>
        <button class="tab" data-t="askstories">Ask</button>
        <button class="tab" data-t="showstories">Show</button>
      </div>
      <div class="list" id="bulletinList"></div>
    </div>`;

  const listEl = $('#bulletinList', root);
  let cat = 'topstories';
  let cache = {};
  let stories = [];

  function domainOf(url) { try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return ''; } }
  function saveSaved() { store.set(SAVE_KEY, saved); }
  function updateSavedBtn() { $('#savedBtn', tools).textContent = `★ Saved (${saved.length})`; }

  async function load() {
    listEl.innerHTML = `<div class="stats" style="text-align:center"><span class="spinner"></span>Loading stories…</div>`;
    try {
      let ids = cache[cat];
      if (!ids) { ids = await fetch(`https://hacker-news.firebaseio.com/v0/${cat}.json`).then(r => r.json()); cache[cat] = ids; }
      const slice = ids.slice(0, 30);
      stories = await Promise.all(slice.map(id => fetch(`https://hacker-news.firebaseio.com/v0/item/${id}.json`).then(r => r.json())));
      listEl.innerHTML = stories.map((s, i) => {
        if (!s || !s.title) return '';
        const dom = s.url ? domainOf(s.url) : '';
        const link = s.url || `https://news.ycombinator.com/item?id=${s.id}`;
        const isSaved = saved.some(x => x.id === s.id);
        return `<div class="story">
          <div class="rank">${i + 1}</div>
          <div class="body">
            <div class="title"><a href="${esc(link)}" target="_blank" rel="noopener noreferrer">${esc(s.title)}</a></div>
            <div class="meta">
              <span class="domain">${esc(dom)}</span>
              <span>▲ ${s.score || 0}</span>
              <span>by ${esc(s.by || 'anon')}</span>
              <span>${esc(fmtDate((s.time || 0) * 1000))}</span>
              <a href="https://news.ycombinator.com/item?id=${s.id}" target="_blank" rel="noopener noreferrer">${s.descendants || 0} comments</a>
              <div class="actions">
                <button class="mini ${isSaved ? 'saved' : ''}" data-save="${s.id}">${isSaved ? '★ Saved' : '☆ Save'}</button>
              </div>
            </div>
          </div>
        </div>`;
      }).join('');
      $$('[data-save]', listEl).forEach(b => b.onclick = () => {
        const id = +b.dataset.save;
        if (saved.some(x => x.id === id)) saved = saved.filter(x => x.id !== id);
        else {
          const st = stories.find(x => x && x.id === id);
          saved.push({ id, title: st ? st.title : 'Item #' + id, url: st && st.url ? st.url : 'https://news.ycombinator.com/item?id=' + id });
        }
        saveSaved(); updateSavedBtn();
        const on = saved.some(x => x.id === id);
        b.classList.toggle('saved', on);
        b.textContent = on ? '★ Saved' : '☆ Save';
      });
    } catch (e) { listEl.innerHTML = `<div class="empty-state"><h3>Couldn't load news</h3><p>${esc(e.message || '')}</p></div>`; }
  }

  $$('.tab', root).forEach(t => t.onclick = () => {
    $$('.tab', root).forEach(x => x.classList.toggle('active', x === t));
    cat = t.dataset.t; load();
  });

  $('#refreshBtn', tools).onclick = () => { cache = {}; load(); };
  $('#savedBtn', tools).onclick = () => {
    if (!saved.length) { toast('No saved stories yet'); return; }
    modal('Saved stories',
      `<div style="max-height:60vh;overflow:auto">
        ${saved.map(x => `<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer" style="display:block;padding:10px;border-bottom:1px solid var(--border)">${esc(x.title)}</a>`).join('')}
      </div>`);
  };

  load();
}

/* ==========================================================================
   24. COMPASS — maps
   ========================================================================== */
function mountCompass(root, tools) {
  let places = [];
  let currentBBox = null;

  tools.innerHTML = `<button class="btn ghost sm" id="myLoc">${I.location} My location</button>`;

  root.innerHTML = `
    <div class="compass">
      <aside class="side">
        <div class="search-box">
          <div style="display:flex;gap:8px">
            <input class="field" id="mapSearch" placeholder="Search a place…">
            <button class="btn primary" id="mapGo">Go</button>
          </div>
        </div>
        <div class="results" id="placeList"></div>
      </aside>
      <div class="map">
        <iframe id="mapFrame" src="https://www.openstreetmap.org/export/embed.html?bbox=-0.5,51.3,0.3,51.7&layer=mapnik" loading="lazy"></iframe>
        <div class="map-zoom">
          <button id="zoomIn" title="Zoom in">+</button>
          <button id="zoomOut" title="Zoom out">−</button>
        </div>
      </div>
    </div>`;

  const listEl = $('#placeList', root);
  const frame = $('#mapFrame', root);

  function bboxAround(lat, lon, delta) {
    return [lon - delta, lat - delta, lon + delta, lat + delta].map(n => n.toFixed(5)).join(',');
  }
  function showMap(lat, lon, delta = 0.02, marker = null) {
    currentBBox = { lat: +lat, lon: +lon, delta };
    const bbox = bboxAround(lat, lon, delta);
    const mk = marker !== null ? `&marker=${marker}` : '';
    frame.src = `https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&layer=mapnik${mk}`;
  }
  function showPlace(p) {
    showMap(p.lat, p.lon, 0.02, `${p.lat},${p.lon}`);
    $$('.place', root).forEach(el => el.classList.toggle('active', el.dataset.id === p.place_id));
  }

  async function search(q) {
    listEl.innerHTML = `<div class="stats" style="padding:20px;text-align:center"><span class="spinner"></span>Searching…</div>`;
    try {
      const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=8&q=' + encodeURIComponent(q));
      places = await r.json();
      if (!places.length) { listEl.innerHTML = `<div class="empty-state" style="padding:20px"><p>No places found.</p></div>`; return; }
      listEl.innerHTML = places.map(p => `
        <div class="place" data-id="${p.place_id}">
          <div class="n">${esc(p.display_name.split(',')[0])}</div>
          <div class="a">${esc(p.display_name)}</div>
        </div>`).join('');
      showPlace(places[0]);
    } catch { listEl.innerHTML = `<div class="empty-state" style="padding:20px"><p>Couldn't search places.</p></div>`; }
  }

  listEl.addEventListener('click', e => {
    const el = e.target.closest('[data-id]');
    if (!el) return;
    const p = places.find(x => String(x.place_id) === el.dataset.id);
    if (p) showPlace(p);
  });
  $('#mapGo', root).onclick = () => { const q = $('#mapSearch', root).value.trim(); if (q) search(q); };
  $('#mapSearch', root).addEventListener('keydown', e => { if (e.key === 'Enter') { const q = e.target.value.trim(); if (q) search(q); } });
  $('#zoomIn', root).onclick = () => { if (currentBBox) showMap(currentBBox.lat, currentBBox.lon, Math.max(currentBBox.delta / 2, 0.002)); };
  $('#zoomOut', root).onclick = () => { if (currentBBox) showMap(currentBBox.lat, currentBBox.lon, Math.min(currentBBox.delta * 2, 5)); };

function mountAlbum(root, tools) {

    const del = e.target.closest('[data-del]');
    if (del) {
      e.stopPropagation();
      const p = photos.find(x => x.id === del.dataset.del);
      if (!p) return;
      if (await confirmDialog('Delete photo?', 'You can undo this for a few seconds afterwards.')) {
        const idx = photos.indexOf(p);
        photos = photos.filter(x => x.id !== p.id);
        save(); render();
        const cancelPurge = p.blob ? deferBlobDelete([bk(p)]) : () => {};
        toast('Photo deleted', 5000, () => { cancelPurge(); photos.splice(Math.min(idx, photos.length), 0, p); save(); render(); });
      }

    }
    const ph = e.target.closest('[data-id]');

    if (!p) return;

    if (!u) { toast('This photo has no stored content.'); return; }

      <div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end">
        <a class="btn primary" href="${u}" download="${esc(p.name)}">Download</a>
      </div>`);
  });

  async function slideshow() {
    if (!photos.length) { toast('No photos to show'); return; }
    let i = 0;
    const el = document.createElement('div');
    el.className = 'slideshow';
    el.innerHTML = `
      <button class="close" data-close>✕</button>
      <button class="nav prev" data-prev>‹</button>
      <img id="ssImg" alt="">
      <button class="nav next" data-next>›</button>`;
    document.body.appendChild(el);
    async function upd() { const u = await photoUrl(photos[i]); if (u && el.isConnected) $('#ssImg', el).src = u; }
    function close() { el.remove(); document.removeEventListener('keydown', onKey); }

    }

    $('[data-prev]', el).onclick = () => { i = (i - 1 + photos.length) % photos.length; upd(); };
    $('[data-next]', el).onclick = () => { i = (i + 1) % photos.length; upd(); };
    document.addEventListener('keydown', onKey);
    upd();
  }

  $('#slideshowBtn', tools).onclick = slideshow;
  render();

  // One-time upgrade: move any old base64 photos out of localStorage into IndexedDB.
  (async () => {
    let changed = false;
    for (const p of photos) {
      if (p.blob !== undefined) continue;
      if (p.data) {
        try { await blobs.put(bk(p), await dataUrlToBlob(p.data)); p.blob = true; delete p.data; changed = true; } catch {}
      } else { p.blob = false; delete p.data; changed = true; }
    }
    if (changed) { save(); if (document.body.contains(root)) render(); }
    if (!albumGcDone) {
      albumGcDone = true;
      try { await blobs.gc('a:', new Set(photos.filter(x => x.blob).map(bk))); } catch {}
    }
  })();
}

  if (o.kind === 'home') {
    const d = await ytApi('videos', Object.assign({ part: 'snippet,contentDetails,statistics', chart: 'mostPopular', maxResults: 24 }, base, o.cat ? { videoCategoryId: o.cat } : {}, o.page ? { pageToken: o.page } : {}));

function loadYTApi() {

  ytApiReady = new Promise((res, rej) => {
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { try { prev && prev(); } catch {} res(); };
    const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; s.async = true;
    s.onerror = () => { ytApiReady = null; s.remove(); rej(new Error('blocked')); };
    document.head.appendChild(s);
    setTimeout(() => { if (!(window.YT && YT.Player)) { ytApiReady = null; rej(new Error('timeout')); } }, 12000);
  });

}

  const codeBlock = c => opts.forDoc
    ? '<pre><code>' + esc(c.code) + '</code></pre>'
    : '<div class="code"><div class="code-head"><span>' + esc(c.lang || 'code') + '</span><button class="mini" data-copycode>Copy</button></div><pre><code>' + esc(c.code) + '</code></pre></div>';

  const isBlank = l => !l.trim();
  const ulRe = /^\s*[-*+]\s+(.*)$/, olRe = /^\s*\d+[.)]\s+(.*)$/, hRe = /^(#{1,6})\s+(.*)$/;

    const line = lines[i];

    if ((m = line.match(hRe))) { const n = Math.min(m[1].length + 1, 6); html += '<h' + n + '>' + inl(m[2]) + '</h' + n + '>'; i++; continue; }
    if (hrRe.test(line)) { html += '<hr>'; i++; continue; }
    if (ulRe.test(line)) {
      const items = [];
      while (i < lines.length && (m = lines[i].match(ulRe))) { items.push('<li>' + inl(m[1]) + '</li>'); i++; }
      html += '<ul>' + items.join('') + '</ul>'; continue;
    }
    if (olRe.test(line)) {
      const items = [];
      while (i < lines.length && (m = lines[i].match(olRe))) { items.push('<li>' + inl(m[1]) + '</li>'); i++; }
      html += '<ol>' + items.join('') + '</ol>'; continue;
    }
    if (bqRe.test(line)) {
      const q = [];

    }

      while (i < lines.length && !isBlank(lines[i]) && lines[i].includes('|')) { rows.push(cells(lines[i])); i++; }

    }
    const para = [];
    while (i < lines.length && !isBlank(lines[i]) && (para.length === 0 || !startsBlock(lines[i], lines[i + 1]))) { para.push(inl(lines[i])); i++; }

    }

    }
  }

}

  function renderModelSel() {
    $('#aiMode', root).value = cfg.mode;

      ? 'Free mode runs a small model on your device, so it can be wrong — check important information. Nothing you type leaves this device.'

      $('#aiHint', root).textContent = ((cur && cur.note) || '') + (st ? ' · ' + st : '');

    }

    modelSel.innerHTML = list.map(m => `<option value="${esc(m.id)}" ${m.id === cfg.model ? 'selected' : ''}>${esc(m.name)}</option>`).join('');
    const cur = list.find(m => m.id === cfg.model);

  $('#aiLen', root).onchange = e => { const n = parseInt(e.target.value, 10); cfg.freeMax = Number.isNaN(n) ? 0 : n; saveCfg(); };
  function warm() {

  $('#aiMode', root).onchange = e => { cfg.mode = e.target.value; saveCfg(); renderModelSel(); renderMsgs(); warm(); };

  function renderSide() {
    const list = chats.slice().sort((a, b) => b.updated - a.updated);
    sideEl.innerHTML = list.length ? list.map(c => `
      <div class="ai-chat ${c.id === activeId ? 'active' : ''}" data-id="${c.id}">
        <span class="t">${esc(c.title || 'New chat')}</span>
        <button class="mini" data-ren="${c.id}" title="Rename">✎</button>
        <button class="mini" data-del="${c.id}" title="Delete">×</button>
      </div>`).join('') : `<div class="rail-empty" style="padding:12px">Your conversations will appear here.</div>`;
  }

  const NA_OPEN = { weather: 'barometer', news: 'bulletin', map: 'compass', calc: 'abacus' };
  const naAppId = tool => { const id = String(tool).split('.')[0]; return NA_OPEN[id] || id; };
  function callsHTML(m, i, chat) {
    if (!m.calls || !m.calls.length) return '';
    const running = streaming && i === chat.messages.length - 1;
    return '<div class="na-calls">' + m.calls.map((c, j) => {
      let st = c.status; if ((st === 'ask' || st === 'wait') && !running) st = 'stale';
      const out = st === 'ask' ? 'Waiting for your OK' : st === 'wait' ? 'Working…' : st === 'stale' ? 'Not run' : st === 'denied' ? 'Not allowed' : (c.out || '');
      const app = APPS.find(x => x.id === naAppId(c.tool)), canOpen = app && (c.tool === 'open.app' || (st === 'ok' && c.write)) && !/^imagine\./.test(c.tool);
      return `<div class="na-call ${st}" data-j="${j}"><div class="na-ic">${c.icon || '🧩'}</div><div class="na-main">
        <div class="na-t"><b>${esc(c.app || 'Spageti')}</b> · ${esc(c.title || c.tool)}</div>
        ${out ? `<div class="na-o">${esc(out)}</div>` : ''}
        ${st === 'ask' ? '<div class="na-btns"><button class="btn primary sm" data-na="allow">Allow</button><button class="btn sm" data-na="deny">Don’t allow</button><button class="btn ghost sm" data-na="all">Allow all in this chat</button></div>' : ''}
        ${c.img ? `<img class="ai-genimg" data-gv="${esc(c.img)}" data-blob="${esc(c.img)}" alt="">` : ''}
        ${canOpen ? `<div class="na-btns"><button class="btn sm" data-open-app="${esc(app.id)}">Open ${esc(app.name)}</button></div>` : ''}
      </div><div class="na-s">${st === 'ok' ? '✓' : st === 'err' ? '⚠' : st === 'denied' ? '✕' : st === 'wait' ? '<span class="spinner" style="margin:0"></span>' : ''}</div></div>`;
    }).join('') + '</div>';
  }

  function msgHTML(m, i, chat) {
    const last = i === chat.messages.length - 1;
    if (m.role === 'user' && m.tool) return '';          // results sent back to the model; shown as cards under the assistant's message
    if (m.role === 'user') {
      const chips = (m.attachments || []).filter(a => !isMedia(a)).map(a => chipHTML(a)).join('');
      const thumbs = (m.attachments || []).map((a, j) => isMedia(a)
        ? `<button class="ai-thumb" data-vm="${i}:${j}" title="${esc(a.title)}"><img data-blob="${esc(mediaKeys(a)[0] || '')}" alt=""><span>${a.kind === 'video' ? '🎬 ' + aiClock(a.dur) + ' · ' : ''}${esc(a.title)}</span></button>` : '').join('');
      return `<div class="ai-msg user" data-i="${i}">
        ${thumbs ? `<div class="ai-thumbs">${thumbs}</div>` : ''}
        ${chips ? `<div class="ai-chips">${chips}</div>` : ''}

    const acts = !live && !(m.calls && m.calls.length) && (m.content || m.error) ? `<div class="ai-actions">

        ${m.images && m.images.length ? '<button class="mini" data-act="gsave">Save to Album</button><button class="mini" data-act="gdl">Download</button>' : m.content ? '<button class="mini" data-act="memo">Save to Memo</button><button class="mini" data-act="quill">Save to Quill</button>' : ''}
        <span class="ai-meta">${esc(modelName(m.model))}${m.usage && (m.usage.in || m.usage.out) ? ` · ${m.usage.in} in / ${m.usage.out} out tokens` : ''}${m.usage && m.usage.tps ? ` · ${Math.round(m.usage.tps)} tok/s` : ''}</span>

      <div class="who">Spageti AI</div>
      <div class="bubble${live ? ' caret' : ''}">${body}${(m.images || []).map(x => `<img class="ai-genimg" data-gv="${esc(x.blob)}" data-blob="${esc(x.blob)}" alt="${esc(x.prompt)}" style="aspect-ratio:${x.w || 1}/${x.h || 1}">`).join('')}</div>
      ${callsHTML(m, i, chat)}
      ${m.truncated && !live ? `<div class="ai-note">${m.ctxFull ? 'The on-device model has run out of memory for this chat, so the reply stops here. Start a new chat, or switch to Claude for longer replies.' : m.noCont ? 'The reply ran out of room while thinking. Choose “No length limit” at the top and try again.' : 'The reply stopped at its length limit.'}${!m.ctxFull && !m.noCont && last && !streaming ? '<button class="mini" data-act="cont">Continue writing</button>' : ''}</div>` : ''}
      ${m.stopped ? '<div class="ai-note">Stopped.</div>' : ''}
      ${m.error ? `<div class="ai-error">⚠ ${esc(m.error)}</div>` : ''}
      ${acts}
    </div>`;
  }

  function renderMsgs(force) {
    const chat = activeChat();
    let banner = '';
    if (cfg.mode === 'claude' && !cfg.key) banner = `<div class="ai-banner"><b>Add your Anthropic API key to chat with Claude.</b>
      <span>Claude mode needs your own API key (paid by usage). Or use Free mode — no key, runs on your device.</span>
      <button class="btn primary sm" data-open-settings>Add API key</button><button class="btn sm" data-use-free>Use Free mode</button></div>`;
    else if (isOai() && !cfg.oai[cfg.mode].key) banner = `<div class="ai-banner"><b>Add your ${esc(OAI_PROVIDERS[cfg.mode].name)} API key to chat with ${esc(oaiName(cfg.mode + ':' + cfg.oai[cfg.mode].model))}.</b>
      <span>This mode uses your own ${esc(OAI_PROVIDERS[cfg.mode].name)} account (billed by them). Or use Free mode — no key, runs on your device.</span>
      <button class="btn primary sm" data-open-settings>Add API key</button><button class="btn sm" data-use-free>Use Free mode</button></div>`;
    else if (cfg.mode === 'free' && !freeAI.ready) banner = `<div class="ai-banner"><b>Free mode runs on your device.</b>
      <span>Your first message downloads a small open-source model once (about 1 GB for the default) and saves it in your browser. Needs a recent Chrome or Edge on a computer with WebGPU. Nothing you type is sent anywhere.</span></div>`;
    if (!chat || !chat.messages.length) {
      msgsEl.innerHTML = banner + `<div class="ai-empty">
        <div class="ai-spark">✦</div><h2>How can I help?</h2>
        <p>Ask anything, or attach a note, document, picture or screen recording.</p>
        <div class="ai-suggest">
          <button class="btn" data-suggest="Explain how a hash table works, with a short example.">Explain how a hash table works</button>
          <button class="btn" data-suggest="Help me write a polite email declining an invitation.">Draft a polite email</button>
          <button class="btn" data-suggest="Give me a simple weekly study plan for learning a new language.">Make a study plan</button>
          <button class="btn" data-suggest="/image a cozy cabin in snowy mountains at dusk, warm light in the windows">🎨 Draw a picture</button>
          ${cfg.apps.on && cfg.mode !== 'free' ? '<button class="btn" data-suggest="What is on my to-do list and calendar this week?">📋 What’s on my plate?</button><button class="btn" data-suggest="Look through my notes and documents and summarize what I have been working on.">🗂️ Summarize my notes</button>' : ''}
          <button class="btn" data-suggest-attach="Summarize the attached in 5 bullet points.">Summarize a note or document…</button>

    hydrate(msgsEl);

  }

  function chipHTML(a, i) {
    const rm = i == null ? '' : ` <button class="mini" data-rm="${i}" title="Remove" aria-label="Remove">×</button>`;
    if (isMedia(a)) return `<span class="ai-chip media" data-view="${i}"><img data-blob="${esc(mediaKeys(a)[0] || '')}" alt="">${a.kind === 'video' ? '🎬 ' : ''}${esc(a.title)}${a.kind === 'video' ? ' · ' + aiClock(a.dur) : ''}${rm}</span>`;
    return `<span class="ai-chip">📄 ${esc(a.title)}${rm}</span>`;
  }
  function hydrate(scope) {                 // pictures live in IndexedDB; give each <img data-blob> its URL
    scope.querySelectorAll('img[data-blob]:not([src])').forEach(async img => {
      let u = null; try { u = await blobs.url(img.dataset.blob); } catch {}
      if (u) img.src = u; else { img.classList.add('gone'); img.alt = 'No longer stored on this device'; }
    });
  }
  function renderChips() {
    chipsEl.innerHTML = pending.map((a, i) => chipHTML(a, i)).join('') + working.map(w => `<span class="ai-chip busy">⏳ ${esc(w.label)}</span>`).join('');
    hydrate(chipsEl);
  }
  function viewMedia(a) {
    const body = a.kind === 'video'
      ? `<p class="ai-help" style="margin:0 0 10px">Spageti AI looks at ${a.frames.length} still frame${a.frames.length === 1 ? '' : 's'} sampled across this ${aiClock(a.dur)} recording. It can’t hear the sound.</p><div class="ai-frames">${a.frames.map(f => `<figure><img data-blob="${esc(f.blob)}" alt=""><figcaption>${aiClock(f.t)}</figcaption></figure>`).join('')}</div>`
      : `<img class="ai-bigimg" data-blob="${esc(a.blob)}" alt="${esc(a.title)}">`;
    modal(a.title, body + '<div class="actions" style="margin-top:14px"><button class="btn primary" data-x>Close</button></div>', (back, close) => { $('[data-x]', back).onclick = close; hydrate(back); });
  }
  function updateSend() {
    sendBtn.textContent = streaming ? 'Stop' : 'Send';
    sendBtn.classList.toggle('danger', streaming);
  }

  /* ---------- conversation -> API ---------- */
  const NO_EYES = 'This model can only read text, so it can’t look at pictures or screen recordings. Switch to Claude or Kimi mode at the top, then press Regenerate.';
  /* fmt: 'text' (Free mode, DeepSeek), 'claude' or 'oai' (these can carry pictures). */
  async function toApi(history, fmt) {
    const out = [];
    let lastUser = -1; history.forEach((m, i) => { if (m.role === 'user') lastUser = i; });
    for (let idx = 0; idx < history.length; idx++) {
      const m = history[idx];
      if (m.role === 'assistant' && !(m.raw || m.content)) continue;
      const blocks = [], atts = m.role === 'user' ? (m.attachments || []) : [];
      const docs = atts.filter(a => !isMedia(a));
      if (docs.length) blocks.push({ type: 'text', text: docs.map(a => '<document title="' + a.title.replace(/"/g, "'") + '">\n' + a.text + '\n</document>').join('\n\n') });
      for (const a of atts.filter(isMedia)) {
        if (fmt === 'text') {
          if (idx === lastUser) { const e = new Error(NO_EYES); e.freeMode = true; throw e; }
          blocks.push({ type: 'text', text: '[Attached ' + (a.kind === 'video' ? 'screen recording' : 'picture') + ' “' + a.title + '” — not shown to this model]' });
          continue;
        }
        const list = a.kind === 'video'
          ? (a.frames || []).map((f, k) => ({ key: f.blob, mime: 'image/jpeg', label: 'Frame ' + (k + 1) + ' of ' + a.frames.length + ' (' + aiClock(f.t) + ') from the screen recording “' + a.title + '”' }))
          : [{ key: a.blob, mime: a.mime || 'image/png', label: 'Picture “' + a.title + '”' }];
        for (const it of list) {
          let b = null; try { b = await blobs.get(it.key); } catch {}
          if (!b) { blocks.push({ type: 'text', text: '[' + it.label + ' is no longer stored on this device]' }); continue; }
          const data = await aiBlobB64(b);
          blocks.push({ type: 'text', text: it.label + ':' });
          blocks.push(fmt === 'claude' ? { type: 'image', source: { type: 'base64', media_type: it.mime, data } } : { type: 'image_url', image_url: { url: 'data:' + it.mime + ';base64,' + data } });
        }
      }
      const mc = m.role === 'assistant' ? (m.raw || m.content) : m.content;
      if (mc) blocks.push({ type: 'text', text: mc });
      const prev = out[out.length - 1];
      if (prev && prev.role === m.role) prev.blocks.push(...blocks); else out.push({ role: m.role, blocks });
    }
    return out.map(m => m.blocks.some(b => b.type !== 'text') ? { role: m.role, content: m.blocks } : { role: m.role, content: m.blocks.map(b => b.text).join('\n\n') });
  }

  let lastPaint = 0;
  function paint() {
    if (raf) return;
    raf = setTimeout(() => {
      raf = 0; lastPaint = performance.now();
      const b = msgsEl.querySelector('.ai-msg.assistant:last-child .bubble');
      if (b && liveMsg) { const v = naVisible(liveMsg.content); b.innerHTML = v ? aiMarkdown(v) : '<span class="ai-help">' + esc(liveMsg.content ? 'Using your apps…' : (liveMsg.status || 'Thinking…')) + '</span>'; }
      scrollDown();
    }, Math.max(0, 60 - (performance.now() - lastPaint)));
  }

  const freeCap = base => { const th = (FREE_MODELS.find(m => m.id === base) || {}).think; if (!cfg.freeMax) return th ? 2048 : 1024; const c = Math.min(Math.max(+cfg.freeMax, 128), 1024); return th ? Math.max(c, 1536) : c; };   // per pass; no-limit replies keep going in further passes
  const isFreeMsg = m => String(m.model || '').startsWith('free:');
  // Fewer tokens to read before the first word appears: keep only the recent part of the chat for the small model.
  function trimForFree(msgs, budget = 6000, perMsg = 12000) {
    const clipped = msgs.map(m => m.content.length > perMsg ? { role: m.role, content: m.content.slice(0, perMsg) + '\n[…shortened for the on-device model]' } : m);
    const out = []; let used = 0, i = clipped.length - 1;
    for (; i >= 0; i--) {
      const len = clipped[i].content.length;
      if (out.length && used + len > budget) break;
      out.unshift(clipped[i]); used += len;
    }
    // a chat must start with the user's message; if the cut left an answer first, pull in its question when it still fits
    if (out.length > 1 && out[0].role !== 'user' && i >= 0 && clipped[i].role === 'user' && used + clipped[i].content.length <= budget * 1.5) out.unshift(clipped[i]);
    while (out.length > 1 && out[0].role !== 'user') out.shift();
    return out;
  }
  async function streamFree(msg, history, usage) {
    const base = msg.model.slice(5), sig = controller.signal;
    const load = async force => {
      try { return await freeLoad(base, p => { if (liveMsg === msg) { msg.status = p; paint(); } }, force); }
      catch (e) { e.freeMode = true; throw e; }
    };
    const apiMsgs = trimForFree(await toApi(history, 'text'));
    let engine = await load(false);
    renderModelSel();
    if (sig.aborted) { msg.stopped = true; return; }
    msg.status = 'Thinking…'; paint();
    sig.addEventListener('abort', () => { try { freeAI.engine && freeAI.engine.interruptGenerate(); } catch {} });
    const make = () => engine.chat.completions.create({
      messages: [{ role: 'system', content: aiSystemPrompt(cfg.system, freeName(base), cfg.freeMax ? freeCap(base) : null, null, !cfg.freeMax) }, ...apiMsgs],
      stream: true, stream_options: { include_usage: true }, max_tokens: freeCap(base), temperature: 0.6
    });
    let stream;
    try { stream = await make(); }
    catch (e) {
      if (e && e.name === 'ModelNotLoadedError') { msg.status = 'Reloading the model…'; paint(); engine = await load(true); if (sig.aborted) { msg.stopped = true; return; } msg.status = 'Thinking…'; paint(); stream = await make(); }
      else throw e;
    }
    let nTok = 0, tFirst = 0, tLast = 0, raw = '';
    const base0 = msg.content;                        // text from earlier passes of this same reply
    // reasoning models (DeepSeek R1) write "<think>…</think>" first: hide that part and show only the answer
    const showRaw = () => {
      const open = raw.indexOf('<think>'), close = raw.indexOf('</think>');
      if (open === -1 && close === -1) { msg.content = base0 + raw; return; }
      if (close === -1) { msg.content = base0; msg.status = 'Thinking… (about ' + Math.round(raw.length / 5).toLocaleString() + ' words of reasoning so far)'; return; }
      msg.content = base0 + raw.slice(close + 8).replace(/^\s+/, '');
    };
    try {
      for await (const chunk of stream) {
        if (!document.body.contains(root)) { try { engine.interruptGenerate(); } catch {} break; }
        const c = chunk.choices && chunk.choices[0];
        if (c && c.delta && c.delta.content) { raw += c.delta.content; showRaw(); paint(); const now = performance.now(); if (!tFirst) tFirst = now; tLast = now; nTok++; }
        if (c && c.finish_reason === 'length') msg.truncated = true;
        if (chunk.usage) {
          usage.in = chunk.usage.prompt_tokens || 0; usage.out = chunk.usage.completion_tokens || 0;
          const dps = chunk.usage.extra && chunk.usage.extra.decode_tokens_per_s; if (dps) usage.tps = dps;
        }
      }
    } catch (e) { if (/DeviceLost|device (was|is) lost/i.test((e.name || '') + ' ' + (e.message || ''))) freeReset(); throw e; }
    if (raw.indexOf('<think>') !== -1 && raw.indexOf('</think>') === -1) { msg.truncated = true; if (!msg.content) { msg.content = 'I ran out of room while thinking.'; msg.noCont = true; } }
    if (!usage.tps && nTok > 3 && tLast > tFirst) usage.tps = (nTok - 1) / ((tLast - tFirst) / 1000);
    if (sig.aborted) msg.stopped = true;
    // gentle nudge toward a faster model when this device is slow
    const order = ['SmolLM2-360M-Instruct', 'Qwen2.5-0.5B-Instruct', 'Qwen2.5-1.5B-Instruct', 'Llama-3.2-3B-Instruct'], at = order.indexOf(base);
    if (usage.tps && usage.tps < 8 && at > 0 && !freeAI.slowTold) { freeAI.slowTold = true; toast('Replies are running at ' + Math.round(usage.tps) + ' tokens/s on this device. “' + freeName(order[at - 1]) + '” in the model menu will be faster.', 7000); }
  }

  const isOaiMsg = m => /^(deepseek|kimi):/.test(String(m.model || ''));
  async function streamOAI(msg, history, usage) {
    const pid = msg.model.slice(0, msg.model.indexOf(':')), P = OAI_PROVIDERS[pid], c = cfg.oai[pid];
    const base = oaiBase(pid, c), official = base === P.base;
    let modelId = msg.model.slice(pid.length + 1);
    const auto = oaiAuto(pid, c, modelId);
    let host = base; try { host = new URL(base).hostname; } catch {}
    const apiMsgs = await toApi(history, P.vision ? 'oai' : 'text');
    const body = { model: modelId, stream: true, stream_options: { include_usage: true },
      messages: [{ role: 'system', content: aiSystemPrompt(cfg.system, null, null, oaiName(msg.model), !cfg.maxTokens, cfg.apps.on) }, ...apiMsgs] };
    const think = pid === 'deepseek' && !!c.think;
    if (pid === 'kimi') body[official ? 'max_completion_tokens' : 'max_tokens'] = cfg.maxTokens ? Math.max(cfg.maxTokens, 8192) : 16384;   // Kimi reasons first, so it needs room; sampling settings are fixed by Moonshot
    else {
      body.max_tokens = think ? Math.max(cfg.maxTokens, 16000) : (cfg.maxTokens || 8192);
      if (official) { body.thinking = { type: think ? 'enabled' : 'disabled' }; if (think) body.reasoning_effort = 'high'; }
      if (!think) body.temperature = 0.7;
    }
    let res;
    try {
      const got = await oaiFetch(base, c.key, body, auto ? await orFreeList(controller.signal) : [modelId], controller.signal);
      res = got.res;

  let capOverride = 0;
  async function streamClaude(msg, hist, usage) {
    const apiMsgs = await toApi(hist, 'claude');

      method: 'POST', signal: controller.signal, headers: aiHeaders(cfg.key),
      body: JSON.stringify({ model: msg.model, max_tokens: max, stream: true, system: aiSystemPrompt(cfg.system, null, null, null, !cfg.maxTokens, cfg.apps.on), messages: apiMsgs })
    });

    if (res.status === 400 && !cfg.maxTokens && !capOverride) {          // this model can't write that much in one go: use less per pass, keep continuing

    }
    if (!res.ok) throw await aiHttpError(res);
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';

      const { value, done } = await reader.read();
      if (done) break;

  const CONT = 'Continue exactly where you stopped. If you were cut off mid-sentence, pick up mid-sentence. Do not repeat anything you already wrote and do not add an introduction.';

  async function runStreamOnce(chat, resume) {

    controller = new AbortController(); streaming = true; liveMsg = msg;
    if (resume) { msg.truncated = false; delete msg.error; delete msg.stopped; }
    updateSend(); renderMsgs(true);
    const usage = { in: 0, out: 0 }, free = isFreeMsg(msg);
    const unlimited = free ? !cfg.freeMax : !cfg.maxTokens, maxAuto = free ? 10 : 6;   // then a "Continue writing" button takes over
    // the reply so far goes back to the model as its own turn, followed by "continue"

  async function send() {

  async function addMedia(f) {

    const room = AI_MAX_IMAGES - imgCount(pending);
    if (room < (vid ? 2 : 1)) { toast('One message can hold up to ' + AI_MAX_IMAGES + ' pictures (a recording counts as several).'); return; }
    if (f.size > (vid ? 1024 : 40) * 1024 * 1024) { toast((f.name || 'That file') + ' is too large (max ' + (vid ? '1 GB' : '40 MB') + ')'); return; }
    const name = f.name && !/^image\.(png|jpe?g|gif|webp)$/i.test(f.name) ? f.name : (vid ? 'Recording ' : 'Screenshot ') + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

    working.push(tag); renderChips();

    const keep = async blob => { const key = 'ai:' + uid(); try { await blobs.put(key, blob); } catch { throw new Error('store'); } stored.push(key); return key; };
    try {
      if (vid) {
        const { dur, frames } = await aiVideoFrames(f, Math.min(12, room), (i, n) => { tag.label = 'Reading ' + name + ' (' + i + '/' + n + ')'; renderChips(); });
        const fr = [];
        for (const x of frames) fr.push({ blob: await keep(x.blob), t: x.t });
        pending.push({ kind: 'video', title: name, dur, frames: fr });
      } else {
        const p = await aiPrepImage(f);
        pending.push({ kind: 'image', title: name, blob: await keep(p.blob), mime: p.mime, w: p.w, h: p.h });
      }
      if (!canSee()) toast('Attached. To send it, switch to Claude or Kimi mode — Free mode and DeepSeek can only read text.', 6500);
    } catch (e) {
      stored.forEach(k => blobs.del(k).catch(() => {}));
      toast(e.message === 'store' ? 'Couldn’t save “' + name + '” in this browser (storage may be full or blocked).'
        : e.message === 'codec' ? 'Your browser can’t open “' + name + '”. MP4 (H.264) and WebM recordings work best.'
        : 'Couldn’t read “' + name + '”.', 6500);
    } finally { working = working.filter(w => w !== tag); renderChips(); }
  }
  async function addFiles(files) {
    for (const f of files) {
      if (/^(image|video)\//i.test(f.type)) await addMedia(f);
      else if (AI_TEXT_FILE({ mime: f.type, name: f.name })) {
        if (f.size > 300 * 1024) { toast(f.name + ' is too large (max 300 KB)'); continue; }
        try { if (!addAttachment(f.name, await f.text())) break; } catch { toast("Couldn't read " + f.name); }
      } else toast((f.name || 'That file') + ' isn’t a picture, video or text file');
    }
    renderChips(); inputEl.focus();
  }
  const enqueue = files => { mediaQ = mediaQ.then(() => addFiles(files)).catch(() => {}); return mediaQ; };

  const onPaste = e => {
    if (!root.isConnected) { document.removeEventListener('paste', onPaste); return; }
    const t = e.target;
    if (t && t !== inputEl && t.closest && t.closest('input,textarea,select,[contenteditable="true"],.modal-back')) return;
    const cd = e.clipboardData; if (!cd) return;
    let files = [...(cd.files || [])];
    if (!files.length) files = [...(cd.items || [])].filter(it => it.kind === 'file').map(it => it.getAsFile()).filter(Boolean);
    files = files.filter(f => /^(image|video)\//i.test(f.type));
    if (!files.length) return;
    // text copied from a spreadsheet or page also comes with a picture of it: keep the text then
    const txt = (cd.getData && cd.getData('text/plain') || '').trim(), html = (cd.getData && cd.getData('text/html')) || '';
    if (txt && !/<img\b/i.test(html) && !files.some(f => /^video\//i.test(f.type) || (f.name && f.name === txt))) return;
    e.preventDefault(); enqueue(files);

  const mainEl = $('.ai-main', root);
  const hasFiles = e => !!(e.dataTransfer && [...(e.dataTransfer.types || [])].includes('Files'));
  mainEl.addEventListener('dragover', e => { if (!hasFiles(e)) return; e.preventDefault(); mainEl.classList.add('drop'); });

  mainEl.addEventListener('drop', e => { if (!hasFiles(e)) return; e.preventDefault(); mainEl.classList.remove('drop'); enqueue([...e.dataTransfer.files]); });
  $('#aiPic', root).onclick = () => {
    const inp = document.createElement('input');

  /* ---------- attach ---------- */
  function addAttachment(title, text) {
    if (pending.length >= 8) { toast('You can attach up to 8 items'); return false; }

          status.textContent = '✓ Key works' + (found.length ? ` — ${found.length} model${found.length === 1 ? '' : 's'} available.` : '.');
        } catch (e) { found = null; status.textContent = '✗ ' + aiFriendly(e); }
      };
      $('[data-ok]', back).onclick = () => {
        cfg.mode = modeEl.value;

        { const n = parseInt($('#sFreeMax', back).value, 10); cfg.freeMax = Number.isNaN(n) ? 0 : n; }

        cfg.system = $('#sSys', back).value;

        for (const pid of Object.keys(OAI_PROVIDERS)) {

          if (pid === 'deepseek') o.think = $('#t_deepseek', back).checked;

  const handoff = store.get('ai:handoff', null);

  if (handoff && inputEl.value) { autosize(); inputEl.setSelectionRange(inputEl.value.length, inputEl.value.length); }
  setTimeout(() => inputEl.focus(), 50);
  setTimeout(warm, 600);
}

/* ==========================================================================
   26b. SKETCH — drawing
   ========================================================================== */
function mountSketch(root, tools) {
  const COLORS = ['#202124', '#ea4335', '#fbbc05', '#34a853', '#4285f4', '#a142f4', '#ffffff'];
  let color = COLORS[0], size = 4, tool = 'pen';
  let undoStack = [], redoStack = [];

  tools.innerHTML = `
    <button class="btn ghost sm" id="skUndo" title="Undo (Ctrl+Z)">↺ Undo</button>
    <button class="btn ghost sm" id="skRedo" title="Redo (Ctrl+Shift+Z)">↻ Redo</button>
    <button class="btn ghost sm" id="skClear">Clear</button>
    <button class="btn sm" id="skAlbum">Save to Album</button>
    <button class="btn primary sm" id="skPng">${I.download} PNG</button>`;

  root.innerHTML = `
    <div class="sketch">
      <div class="bar">
        <button class="btn sm tool active" data-tool="pen">✎ Pen</button>
        <button class="btn sm tool" data-tool="eraser">⌫ Eraser</button>
        <div style="display:flex;gap:6px;align-items:center" id="swatches"></div>
        <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)">Size
          <input type="range" id="skSize" min="1" max="40" value="4"></label>
      </div>
      <div class="board"><canvas id="skCanvas" aria-label="Drawing canvas"></canvas></div>
    </div>`;

  const canvas = $('#skCanvas', root);
  const ctx = canvas.getContext('2d');
  const SNAP_KEY = 'sketch:last';

  $('#swatches', root).innerHTML = COLORS.map((c, i) =>
    `<button class="swatch ${i === 0 ? 'active' : ''}" data-c="${c}" style="background:${c}" aria-label="Colour ${c}"></button>`).join('');

  function fitCanvas(keep) {
    const snap = keep ? canvas.toDataURL() : null;
    const r = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.round(r.width * dpr));
    canvas.height = Math.max(1, Math.round(r.height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, r.width, r.height);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (snap) { const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0, r.width, r.height); img.src = snap; }
  }
  function pushUndo() {
    try { undoStack.push(canvas.toDataURL()); if (undoStack.length > 30) undoStack.shift(); } catch {}
    redoStack = [];
  }
  function restore(url) {
    const img = new Image();
    const r = canvas.getBoundingClientRect();
    img.onload = () => {
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, r.width, r.height); ctx.drawImage(img, 0, 0, r.width, r.height);
      if (url.startsWith('blob:')) URL.revokeObjectURL(url);
    };
    img.src = url;
  }
  function persist() { try { canvas.toBlob(b => { if (b) blobs.put('s:last', b).catch(() => {}); }, 'image/jpeg', 0.75); } catch {} }

  let drawing = false, last = null;
  function pos(e) { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    pushUndo();
    drawing = true; last = pos(e);
    ctx.fillStyle = tool === 'eraser' ? '#fff' : color;
    ctx.beginPath(); ctx.arc(last.x, last.y, size / 2, 0, Math.PI * 2); ctx.fill();
  });
  canvas.addEventListener('pointermove', e => {
    if (!drawing) return;
    const p = pos(e);
    ctx.strokeStyle = tool === 'eraser' ? '#fff' : color;
    ctx.lineWidth = tool === 'eraser' ? size * 2 : size;
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    last = p;
  });
  const end = () => { if (drawing) { drawing = false; persist(); } };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);

  $$('.tool', root).forEach(b => b.onclick = () => {
    tool = b.dataset.tool;
    $$('.tool', root).forEach(x => x.classList.toggle('active', x === b));
  });
  $$('.swatch', root).forEach(b => b.onclick = () => {
    color = b.dataset.c; tool = 'pen';
    $$('.swatch', root).forEach(x => x.classList.toggle('active', x === b));
    $$('.tool', root).forEach(x => x.classList.toggle('active', x.dataset.tool === 'pen'));
  });
  $('#skSize', root).oninput = e => { size = +e.target.value; };

  function undo() { if (!undoStack.length) return; redoStack.push(canvas.toDataURL()); restore(undoStack.pop()); setTimeout(persist, 50); }
  function redo() { if (!redoStack.length) return; undoStack.push(canvas.toDataURL()); restore(redoStack.pop()); setTimeout(persist, 50); }
  $('#skUndo', tools).onclick = undo;
  $('#skRedo', tools).onclick = redo;
  $('#skClear', tools).onclick = async () => {
    if (!(await confirmDialog('Clear canvas?', 'You can undo this afterwards.'))) return;
    pushUndo();
    const r = canvas.getBoundingClientRect();
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, r.width, r.height); persist();
  };
  $('#skPng', tools).onclick = () => canvas.toBlob(b => b && download('sketch.png', b, 'image/png'));
  $('#skAlbum', tools).onclick = () => canvas.toBlob(async b => {
    if (!b) return;
    const id = uid();
    try { await blobs.put('a:' + id, b); } catch (e) { toast("Couldn't save: " + (e.message || 'storage error')); return; }
    const photos = store.get('album:photos', []);
    photos.unshift({ id, name: 'Sketch ' + new Date().toLocaleString() + '.png', size: b.size, blob: true, time: Date.now() });
    if (store.set('album:photos', photos)) toast('Saved to Album');
    else blobs.del('a:' + id).catch(() => {});
  }, 'image/png');

  function keys(e) {

  /* ---------- data ---------- */
  const MAX_CHARS = 2000000;
  const normalize = t => String(t).replace(/\r\n?/g, '\n').replace(/\t/g, '  ').replace(/[ ]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
  function dataStat() {
    const t = textEl.value, n = t.length;
    if (!n) { statEl.textContent = 'No text yet.'; return; }
    const uniq = new Set(t).size, words = (t.match(/\S+/g) || []).length;
    const q = n < 5000 ? 'Very small — it will mostly memorise this text.' : n < 50000 ? 'Small — it will pick up words and style.' : n < 500000 ? 'Good amount.' : 'Plenty — training will be slow per pass but learns well.';
    statEl.textContent = `${fmt(n)} characters · ${fmt(words)} words · ${uniq} distinct characters. ${q}`;
  }
  let draftTimer = 0;
  textEl.addEventListener('input', () => {
    dataStat();
    clearTimeout(draftTimer);
    draftTimer = setTimeout(() => { if (textEl.value.length < 300000) store.set(DKEY, textEl.value); else store.del(DKEY); }, 600);
  });
  function addText(s, label) {
    if (!s || !s.trim()) { toast('Nothing to add from ' + label); return; }
    let v = (textEl.value ? textEl.value.replace(/\s+$/, '') + '\n\n' : '') + s.trim();
    if (v.length > MAX_CHARS) { v = v.slice(0, MAX_CHARS); toast('Trimmed to 2,000,000 characters'); }
    textEl.value = v; textEl.dispatchEvent(new Event('input'));
    toast('Added text from ' + label);
  }
  el('fMemo').onclick = () => addText((store.get('memo:notes', []) || []).map(n => ((n.title ? n.title + '\n' : '') + (n.body || '')).trim()).filter(Boolean).join('\n\n'), 'Memo');
  el('fQuill').onclick = () => addText((store.get('quill:docs', []) || []).map(d => htmlToText(d.content || '')).filter(Boolean).join('\n\n'), 'Quill');
  el('fFile').onclick = () => {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.txt,.md,.csv,.json,.html,.xml,.log,text/*'; inp.multiple = true;
    inp.onchange = async () => { for (const f of inp.files) addText(await f.text(), f.name); };
    inp.click();
  };
  el('fClear').onclick = () => { textEl.value = ''; textEl.dispatchEvent(new Event('input')); };
  textEl.value = store.get(DKEY, '') || ''; dataStat();

  /* ---------- chart ---------- */
  function drawChart(tr, va) {
    const c = chart.getContext && chart.getContext('2d');
    if (!c) return;
    const dpr = window.devicePixelRatio || 1, w = chart.clientWidth || 360, h = 140;
    if (chart.width !== Math.round(w * dpr)) { chart.width = Math.round(w * dpr); chart.height = Math.round(h * dpr); }
    c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, w, h);
    const cs = getComputedStyle(root);
    const accent = cs.getPropertyValue('--accent').trim() || '#1a73e8', border = cs.getPropertyValue('--border').trim() || '#ccc', muted = cs.getPropertyValue('--muted').trim() || '#666';
    const all = tr.map(p => p.y).concat(va.map(p => p.y)).filter(Number.isFinite);
    if (all.length < 2) return;
    const maxX = Math.max(...tr.map(p => p.x), 1), maxY = Math.max(...all) * 1.05, minY = 0;
    const X = x => 34 + (x / maxX) * (w - 44), Y = y => h - 18 - ((y - minY) / (maxY - minY || 1)) * (h - 30);
    c.strokeStyle = border; c.lineWidth = 1; c.fillStyle = muted; c.font = '10px sans-serif';
    for (let i = 0; i <= 3; i++) { const yv = minY + (maxY - minY) * i / 3, y = Y(yv); c.beginPath(); c.moveTo(34, y); c.lineTo(w - 10, y); c.stroke(); c.fillText(yv.toFixed(1), 4, y + 3); }
    const line = (pts, col, wd) => { c.strokeStyle = col; c.lineWidth = wd; c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(X(p.x), Y(p.y)) : c.moveTo(X(p.x), Y(p.y))); c.stroke(); };
    line(tr, accent, 2); if (va.length > 1) line(va, '#e8710a', 2);
  }

  /* ---------- training ---------- */
  function setRunning(on) {
    trainBtn.disabled = on; pauseBtn.disabled = !on; stopBtn.disabled = !on;
    ['fName', 'fSize', 'fSteps'].forEach(id => { el(id).disabled = on; });
    pauseBtn.textContent = 'Pause';
  }
  function saveModels() { return store.set(MKEY, models); }

  async function train() {
    const raw = normalize(textEl.value);
    if (raw.length < 1500) { toast('Add at least 1,500 characters of text first (50,000+ is much better).', 4500); return; }
    const sizeKey = el('fSize').value, preset = FORGE_PRESETS[sizeKey], steps = +el('fSteps').value;
    const name = (el('fName').value || 'My AI').trim().slice(0, 40) || 'My AI';
    const chars = forgeVocab(raw), data = forgeEncode(raw, chars), V = chars.length;
    if (V < 5) { toast('That text has too few different characters to learn from.'); return; }
    const N = preset.ctx, B = preset.batch;
    const big = data.length > 4000;
    const trainTo = big ? Math.floor(data.length * 0.9) : data.length, vFrom = big ? trainTo : 0, vTo = data.length;
    let lm;
    try { lm = createTinyLM(V, preset); } catch (e) { toast(e.message); return; }
    const ctx = new Int32Array(B * N), tgt = new Int32Array(B);
    run = { stop: false, paused: false };
    setRunning(true); sampleEl.textContent = '…'; drawChart([], []);
    const tr = [], va = [];
    let step = 0, ema = null, val = NaN, lastUi = 0, lastSample = 0, speed = 0;
    const t0 = performance.now(); let tSpeed = t0, sSpeed = 0;
    const sampleNow = () => {
      const s = Math.floor(Math.random() * Math.max(1, data.length - N)), seed = raw.slice(s, s + N);
      try { sampleEl.textContent = seed + lm.generate(seed, chars, 220, 0.8); } catch {}
    };
    const ui = () => {
      fill.style.width = (step / steps * 100).toFixed(1) + '%';
      const left = speed > 0 ? Math.max(0, Math.round((steps - step) / speed)) : null;
      runStat.textContent = `Step ${fmt(step)} / ${fmt(steps)} · loss ${ema == null ? '—' : ema.toFixed(2)} · validation ${Number.isFinite(val) ? val.toFixed(2) : '—'}` +
        (speed ? ` · ${Math.round(speed)} steps/s` : '') + (left != null && !run.paused ? ` · ~${left < 90 ? left + ' s' : Math.round(left / 60) + ' min'} left` : '') + (run.paused ? ' · paused' : '');
      drawChart(tr, va);
    };
    while (step < steps && !run.stop && root.isConnected) {
      if (run.paused) { ui(); await sleep(150); continue; }
      const tick = performance.now();
      while (step < steps && !run.stop && !run.paused && performance.now() - tick < 14) {
        const lr = LR[sizeKey] * (0.1 + 0.9 * 0.5 * (1 + Math.cos(Math.PI * step / steps)));
        forgeBatch(data, 0, trainTo, N, B, ctx, tgt);
        const l = lm.trainStep(ctx, tgt, lr);
        ema = ema == null ? l : ema * 0.98 + l * 0.02; step++;
        if (step % 40 === 0) tr.push({ x: step, y: ema });
        if (step % 250 === 0) { val = lm.evaluate(data, vFrom, vTo); va.push({ x: step, y: val }); }
      }
      const now = performance.now();
      if (now - tSpeed > 700) { speed = (step - sSpeed) / ((now - tSpeed) / 1000); tSpeed = now; sSpeed = step; }
      if (now - lastUi > 150) { ui(); lastUi = now; }
      if (now - lastSample > 2500) { sampleNow(); lastSample = now; }
      await sleep(0);
    }
    const finished = step >= steps;
    if (step < 100) { runStat.textContent = 'Stopped before anything was learned — nothing saved.'; run = null; setRunning(false); return; }
    val = lm.evaluate(data, vFrom, vTo); va.push({ x: step, y: val }); tr.push({ x: step, y: ema });
    sampleNow(); fill.style.width = (step / steps * 100).toFixed(1) + '%'; drawChart(tr, va);
    const meta = { id: uid(), name, chars, cfg: { ctx: N, emb: preset.emb, hid: preset.hid, batch: B }, size: sizeKey, steps: step, loss: +ema.toFixed(3), val: +val.toFixed(3), dataChars: raw.length, params: lm.params, time: Date.now() };
    try {
      await blobs.put('m:' + meta.id, new Blob([lm.weights.slice().buffer]));
      models.push(meta);
      if (!saveModels()) { models.pop(); await blobs.del('m:' + meta.id); throw new Error('Out of space'); }
      cache.set(meta.id, lm); selectedId = meta.id;
      if (root.isConnected) renderModels();
      toast(`${finished ? 'Training finished' : 'Stopped'} — “${name}” saved`, 4000);
    } catch (e) { toast("Couldn't save the model: " + (e.message || 'storage error'), 5000); }
    if (root.isConnected) runStat.textContent = `${finished ? 'Done' : 'Stopped'} after ${fmt(step)} steps · loss ${ema.toFixed(2)} · validation ${val.toFixed(2)}.`;
    run = null; if (root.isConnected) setRunning(false);
  }
  trainBtn.onclick = train;
  pauseBtn.onclick = () => { if (!run) return; run.paused = !run.paused; pauseBtn.textContent = run.paused ? 'Resume' : 'Pause'; };
  stopBtn.onclick = () => { if (run) { run.stop = true; run.paused = false; } };

  /* ---------- models ---------- */
  const current = () => models.find(m => m.id === selectedId) || null;
  async function loadModel(meta) {
    if (cache.has(meta.id)) return cache.get(meta.id);
    const blob = await blobs.get('m:' + meta.id);
    if (!blob) throw new Error('The weights for this AI are missing from storage.');
    const lm = createTinyLM(meta.chars.length, meta.cfg, new Float32Array(await blob.arrayBuffer()));
    cache.set(meta.id, lm);
    return lm;
  }
  function renderModels() {
    const box = el('fModels');
    if (!models.length) { box.innerHTML = `<div class="fempty">You haven't trained an AI yet. Add some text above and press <b>Start training</b>, or import one.</div>`; el('fTry').hidden = true; return; }
    el('fTry').hidden = false;
    if (!current()) selectedId = models[models.length - 1].id;
    box.innerHTML = models.slice().reverse().map(m => `
      <div class="fmodel ${m.id === selectedId ? 'active' : ''}" data-id="${m.id}">
        <div class="fm-main"><b>${esc(m.name)}</b>
          <span>${fmt(m.params)} parameters · ${fmt(m.steps)} steps · loss ${m.loss}${Number.isFinite(m.val) ? ' · validation ' + m.val : ''} · trained on ${fmt(m.dataChars)} characters · ${esc(new Date(m.time).toLocaleDateString())}</span></div>
        <button class="btn sm ${m.id === selectedId ? 'primary' : ''}" data-use>${m.id === selectedId ? 'In use' : 'Use'}</button>
        <button class="btn ghost sm" data-exp>Export</button>
        <button class="btn ghost sm" data-del>Delete</button>
      </div>`).join('');
    el('fUsing').textContent = 'Talking to: ' + current().name;
  }
  el('fModels').addEventListener('click', async e => {
    const row = e.target.closest('[data-id]'); if (!row) return;
    const m = models.find(x => x.id === row.dataset.id); if (!m) return;
    if (e.target.closest('[data-use]')) { selectedId = m.id; renderModels(); }
    else if (e.target.closest('[data-exp]')) {
      try {
        const lm = await loadModel(m);
        const file = { format: 'nimbus-tinylm', version: 1, meta: { name: m.name, chars: m.chars, cfg: m.cfg, size: m.size, steps: m.steps, loss: m.loss, val: m.val, dataChars: m.dataChars, params: m.params }, weights: forgeToBase64(lm.weights) };
        download(m.name.replace(/[^\w.-]+/g, '_') + '.nimbusai.json', JSON.stringify(file), 'application/json');
      } catch (err) { toast(err.message || "Couldn't export"); }
    } else if (e.target.closest('[data-del]')) {
      if (!(await confirmDialog('Delete this AI?', `“${m.name}” will be removed from this device. Export it first if you want to keep it.`))) return;
      models = models.filter(x => x.id !== m.id); cache.delete(m.id); saveModels();
      blobs.del('m:' + m.id).catch(() => {}); renderModels();
    }
  });
  $('#fImport', tools).addEventListener('click', () => {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = async () => {
      const f = inp.files[0]; if (!f) return;
      try {
        const j = JSON.parse(await f.text());
        if (j.format !== 'nimbus-tinylm' || !j.meta || typeof j.meta.chars !== 'string' || typeof j.weights !== 'string') throw new Error('This is not a Spageti AI file.');
        const c = j.meta.cfg || {}, ok = k => Number.isInteger(c[k]) && c[k] > 0 && c[k] <= (k === 'hid' ? 1024 : 64);
        if (!ok('ctx') || !ok('emb') || !ok('hid') || j.meta.chars.length < 2 || j.meta.chars.length > 256) throw new Error('This AI file has invalid settings.');
        const w = forgeFromBase64(j.weights), cfg = { ctx: c.ctx, emb: c.emb, hid: c.hid, batch: 32 };
        if (w.length !== forgeParamCount(j.meta.chars.length, cfg)) throw new Error('The weights in this file are damaged.');
        const meta = { id: uid(), name: String(j.meta.name || 'Imported AI').slice(0, 40), chars: j.meta.chars, cfg, size: j.meta.size || 'medium', steps: +j.meta.steps || 0, loss: +j.meta.loss || 0, val: +j.meta.val, dataChars: +j.meta.dataChars || 0, params: w.length, time: Date.now() };
        createTinyLM(meta.chars.length, cfg, w);                      // final validation
        await blobs.put('m:' + meta.id, new Blob([w.buffer]));
        models.push(meta); if (!saveModels()) { models.pop(); await blobs.del('m:' + meta.id); return; }
        selectedId = meta.id; renderModels(); toast('Imported “' + meta.name + '”');
      } catch (err) { toast(err.message || "Couldn't import that file", 4500); }
    };
    inp.click();
  });

  /* ---------- generate ---------- */
  const lenEl = el('fLen'), tempEl = el('fTemp'), outEl = el('fOut');
  lenEl.oninput = () => { el('fLenV').textContent = lenEl.value; };
  tempEl.oninput = () => { el('fTempV').textContent = (+tempEl.value).toFixed(2); };
  async function generate() {
    const m = current(); if (!m) return;
    const my = ++genToken;
    let lm; try { lm = await loadModel(m); } catch (e) { toast(e.message, 4500); return; }
    const prompt = el('fPrompt').value; let text = prompt;
    const total = +lenEl.value, temp = +tempEl.value;
    outEl.textContent = text;
    for (let done = 0; done < total && my === genToken && root.isConnected; done += 24) {
      text += lm.generate(text, m.chars, Math.min(24, total - done), temp);
      outEl.textContent = text; await sleep(16);
    }
  }
  el('fGen').onclick = generate;
  el('fPrompt').addEventListener('keydown', e => { if (e.key === 'Enter') generate(); });
  el('fCopy').onclick = () => { navigator.clipboard && navigator.clipboard.writeText(outEl.textContent).then(() => toast('Copied'), () => toast("Couldn't copy")); };

  renderModels();
  const cleanup = () => { if (!root.isConnected) { if (run) run.stop = true; genToken++; window.removeEventListener('hashchange', cleanup); } };
  window.addEventListener('hashchange', () => setTimeout(cleanup, 0));
}

/* ---------- Google sign-in (Google Identity Services) ----------
   There is no Spageti server: the signed token Google returns is checked and decoded here to get your name,
   email and photo, which are kept in this browser. It identifies you in the UI; it does not lock your data. */
const account = () => { const a = store.get('account', null); return a && a.email ? a : null; };
const safePic = u => /^https:\/\/[a-z0-9.-]+\.googleusercontent\.com\//i.test(String(u || '')) ? String(u) : '';
const avatarInner = a => a && a.picture ? `<img class="av-pic" src="${esc(a.picture)}" alt="" referrerpolicy="no-referrer">` : esc(((a && (a.name || a.email)) || 'N').trim().charAt(0).toUpperCase() || 'N');
function renderAccount() {
  const a = account();
  $('#avatarBtn').innerHTML = avatarInner(a);
  $('#avatarBtn').title = a ? 'Account — ' + a.email : 'Account';
  $('#avBig').innerHTML = avatarInner(a);
  $('#avName').textContent = a ? a.name : 'Spageti user';
  $('#avMail').textContent = a ? a.email : 'Not signed in';
  $('#avSign').textContent = a ? '🚪 Sign out' : '🔑 Sign in with Google';
}
function signOutGoogle() {
  store.del('account');
  try { window.google && google.accounts.id.disableAutoSelect(); } catch {}
  renderAccount();
}
function parseJwt(t) {
  const p = String(t || '').split('.'); if (p.length !== 3) throw new Error('Google sent a response Spageti could not read.');
  const b = p[1].replace(/-/g, '+').replace(/_/g, '/'); const bin = atob(b + '='.repeat((4 - b.length % 4) % 4));
  return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
}
function loadGsi() {
  return new Promise((res, rej) => {
    if (window.google && google.accounts && google.accounts.id) return res();
    let sc = document.querySelector('script[data-gsi]');
    if (!sc) { sc = document.createElement('script'); sc.src = 'https://accounts.google.com/gsi/client'; sc.async = true; sc.dataset.gsi = '1'; document.head.appendChild(sc); }
    const t = setTimeout(() => rej(new Error('timeout')), 12000);
    sc.addEventListener('load', () => { clearTimeout(t); res(); });
    sc.addEventListener('error', () => { clearTimeout(t); sc.remove(); rej(new Error('blocked')); });
  });
}
const fromFile = () => location.protocol === 'file:' || location.origin === 'null';
const originNote = () => fromFile()
  ? `<div class="g-warn"><b>Spageti is open from a file on your computer.</b> Google refuses sign-in from files. Serve it over a web address instead — for example, in the folder that holds this file run <code>python3 -m http.server 8000</code> and open <code>http://localhost:8000/</code> followed by the file name — or host it on any https site. Then add that address as an authorised origin (step 2 below).</div>`
  : '';
function openGoogleSetup(next) {
  const cid = store.get('auth:clientId', '');
  modal('Set up Google sign-in', `
    ${originNote()}
    <p style="margin:0 0 10px;font-size:13px;line-height:1.6;color:var(--muted)">Google sign-in needs a free “Client ID” that belongs to you — one-time setup, about 3 minutes:</p>
    <ol class="steps-ol">
      <li>In the <a href="https://console.cloud.google.com/apis/credentials" target="_blank" rel="noopener noreferrer">Google Cloud Console</a>, choose <b>Create credentials → OAuth client ID</b>, type <b>Web application</b> (Google may first ask you to fill in a short “consent screen”).</li>
      <li>Under <b>Authorised JavaScript origins</b> add <code>${esc(fromFile() ? 'http://localhost:8000' : location.origin)}</code>${fromFile() ? '' : ' (this page’s address)'}.</li>
      <li>Copy the Client ID — it ends in <code>.apps.googleusercontent.com</code> — and paste it here:</li>
    </ol>
    <div class="fields"><div><label>Google Client ID</label><input class="field" id="gCid" value="${esc(cid)}" placeholder="1234567890-abc….apps.googleusercontent.com" spellcheck="false" autocomplete="off"></div></div>
    <p class="g-note">The Client ID is not a secret. Spageti has no server: it reads your name, email and photo from Google’s signed response and keeps them in this browser. This shows who you are in Spageti — it doesn’t password-protect your data.</p>
    <p class="ai-help" id="gSetMsg" style="min-height:18px;color:#ea4335"></p>
    <div class="actions"><button class="btn ghost" data-x>Cancel</button><button class="btn primary" data-ok>Save and continue</button></div>`,
  (back, close) => {
    const inp = $('#gCid', back), msg = $('#gSetMsg', back);
    $('[data-x]', back).onclick = close;
    const go = () => {
      const v = inp.value.trim();
      if (!/^[A-Za-z0-9._-]+\.apps\.googleusercontent\.com$/.test(v)) { msg.textContent = 'That doesn’t look like a Client ID. It should end in .apps.googleusercontent.com'; return; }
      store.set('auth:clientId', v); close(); (next || openGoogleSignIn)();
    };
    $('[data-ok]', back).onclick = go; inp.onkeydown = e => { if (e.key === 'Enter') go(); };
    setTimeout(() => inp.focus(), 30);
  });
}
function openGoogleSignIn() {
  const cid = store.get('auth:clientId', '');
  if (!cid) return openGoogleSetup();
  const nonce = uid() + uid();
  modal('Sign in with Google', `
    ${originNote()}
    <p style="margin:0 0 16px;font-size:14px;line-height:1.6;color:var(--muted)">Sign in to show your Google name, email and photo in Spageti. Your Spageti data stays in this browser.</p>
    <div id="gBtn" style="min-height:44px;display:flex;justify-content:center;align-items:center;color:var(--muted);font-size:13px">${fromFile() ? '' : 'Loading Google…'}</div>
    <p class="ai-help" id="gMsg" style="min-height:18px;margin-top:10px;color:#ea4335"></p>
    <div class="actions"><button class="btn ghost" data-setup style="margin-right:auto">Change Client ID</button><button class="btn ghost" data-x>Cancel</button></div>`,
  async (back, close) => {
    const box = $('#gBtn', back), msg = $('#gMsg', back);
    $('[data-x]', back).onclick = close;
    $('[data-setup]', back).onclick = () => { close(); openGoogleSetup(); };
    if (fromFile()) return;
    try { await loadGsi(); }
    catch { box.textContent = ''; msg.textContent = 'Couldn’t load Google’s sign-in. Check your internet connection or any ad/privacy blocker, then try again.'; return; }
    if (!document.body.contains(back)) return;
    try {
      google.accounts.id.initialize({ client_id: cid, nonce, auto_select: false, callback: resp => {
        try {
          const t = parseJwt(resp && resp.credential);
          if (t.aud !== cid) throw new Error('This sign-in was issued for a different app.');
          if (t.iss !== 'https://accounts.google.com' && t.iss !== 'accounts.google.com') throw new Error('The sign-in did not come from Google.');
          if (!(t.exp * 1000 > Date.now())) throw new Error('The sign-in has expired — please try again.');
          if (t.nonce !== nonce) throw new Error('The sign-in did not match this request — please try again.');
          if (!t.email) throw new Error('Google did not share an email address.');
          store.set('account', { name: String(t.name || t.email).slice(0, 80), email: String(t.email).slice(0, 120), picture: safePic(t.picture), sub: String(t.sub || ''), at: Date.now() });
          close(); renderAccount(); toast('Signed in as ' + t.email);
        } catch (e) { msg.textContent = e.message || 'Sign-in failed.'; }
      } });
      box.textContent = '';
      google.accounts.id.renderButton(box, { theme: 'outline', size: 'large', text: 'signin_with', shape: 'pill', width: 280 });
    } catch (e) { box.textContent = ''; msg.textContent = 'Google sign-in could not start: ' + (e.message || e); }
  });
}
/* ---------- Google Drive backup ----------

const DRIVE_API = 'https://www.googleapis.com/drive/v3', DRIVE_UP = 'https://www.googleapis.com/upload/drive/v3';

    const cid = store.get('auth:clientId', '');

      if (!drive.client || drive.cid !== cid) {
        drive.cid = cid;
        drive.client = google.accounts.oauth2.initTokenClient({ client_id: cid, scope: DRIVE_SCOPE, callback: () => {}, error_callback: () => {} });

        if (r && r.access_token) { drive.token = r.access_token; drive.exp = Date.now() + (+r.expires_in || 3600) * 1000; res(drive.token); }

      };

  if (e.gerr === 'access_denied') return 'Access was not granted. Choose your Google account and allow Spageti to keep a backup in its own Drive folder.';
  if (e.gerr) return 'Google would not give access (' + e.gerr + '). Check the setup steps below.';
  if (e.status === 401) { drive.token = ''; return 'Your Google access expired. Click the button again.'; }

  if (e.status === 403 && /storageQuota|quota/i.test(e.message + e.reason)) return 'Your Google Drive is full — free up some space and try again.';
  if (e.status === 403) return 'Google refused: ' + e.message + ' — check the setup steps below (especially adding yourself as a test user).';

function searchData(q) {
  const query = q.trim().toLowerCase();
  if (query.length < 2) return [];
  const hits = [];
  const push = (app, title, sub, hash) =>
    hits.push({ group: app, icon: '•', title, sub, run: () => location.hash = hash });

  (store.get('memo:notes', []) || []).forEach(n => {
    if ((n.title + ' ' + n.body).toLowerCase().includes(query))
      push('Memo', n.title || 'Untitled', (n.body || '').slice(0, 70), '#/memo');
  });
  (store.get('quill:docs', []) || []).forEach(d => {
    const text = (d.title + ' ' + (d.content || '').replace(/<[^>]*>/g, ' ')).toLowerCase();
    if (text.includes(query))
      push('Quill', d.title || 'Untitled', (d.content || '').replace(/<[^>]*>/g, ' ').slice(0, 70), '#/quill');
  });
  (store.get('rolodex:contacts', []) || []).forEach(c => {
    if ((c.name + ' ' + c.email + ' ' + (c.phone || '')).toLowerCase().includes(query))
      push('Rolodex', c.name, c.email, '#/rolodex');
  });
  (store.get('vault:files', []) || []).forEach(f => {
    if ((f.name || '').toLowerCase().includes(query))
      push('Vault', f.name, f.type === 'folder' ? 'Folder' : (f.mime || 'File'), '#/vault');
  });
  (store.get('almanac:events', []) || []).forEach(e => {
    if ((e.title + ' ' + (e.note || '')).toLowerCase().includes(query))
      push('Almanac', e.title, `${e.date} ${e.time}`, '#/almanac');
  });
  (store.get('errand:data', { tasks: [] }).tasks || []).forEach(t => {
    if ((t.text || '').toLowerCase().includes(query))
      push('Errand', t.text, t.done ? 'Completed' : (t.due || 'No due date'), '#/errand');
  });
  (store.get('courier:messages', []) || []).forEach(m => {
    if ((m.from + ' ' + m.subject + ' ' + m.body).toLowerCase().includes(query))
      push('Courier', m.subject, 'From ' + m.from, '#/courier');
  });

  (store.get('ai:chats', []) || []).forEach(c => {
    const hay = ((c.title || '') + ' ' + (c.messages || []).map(m => m.content).join(' ')).toLowerCase();
    if (hay.includes(query)) {
      const a = (c.messages || []).find(m => m.role === 'assistant' && m.content);
      push('Spageti AI', c.title || 'Chat', a ? a.content.slice(0, 70) : '', '#/ai');
    }
  });

  return hits.slice(0, 20);
}

let paletteOpen = false;
let paletteEl = null;

function buildPalette(query) {
  const q = query.trim().toLowerCase();
  const matches = q
    ? STATIC_COMMANDS.filter(c => (c.label + ' ' + (c.sub || '') + ' ' + c.group).toLowerCase().includes(q))
    : STATIC_COMMANDS;
  return [...matches.slice(0, 20), ...searchData(query)];
}

function openPalette() {
  if (paletteOpen) return;
  paletteOpen = true;
  paletteEl = document.createElement('div');
  paletteEl.className = 'palette-back';
  paletteEl.innerHTML = `
    <div class="palette" role="dialog" aria-modal="true">
      <input class="palette-input" id="paletteInput"
             placeholder="Search apps, notes, docs, contacts, files…"
             autocomplete="off" spellcheck="false">
      <div class="palette-list" id="paletteList"></div>
      <div class="palette-foot">
        <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
        <span><kbd>↵</kbd> open</span>
        <span><kbd>Esc</kbd> close</span>
      </div>
    </div>`;
  document.body.appendChild(paletteEl);
  const input = paletteEl.querySelector('#paletteInput');
  const list = paletteEl.querySelector('#paletteList');
  let active = -1;
  let items = [];

  function render() {
    items = buildPalette(input.value);
    active = items.length ? 0 : -1;
    if (!items.length) { list.innerHTML = `<div class="palette-empty">No matches</div>`; return; }
    list.innerHTML = items.map((it, i) => `
      <div class="palette-row ${i === active ? 'active' : ''}" data-i="${i}">
        <span class="icon">${it.icon || '•'}</span>
        <div class="body">
          <div class="title">${esc(it.label || it.title)}</div>
          ${(it.sub !== undefined) ? `<div class="sub">${esc(it.sub || '')}</div>` : ''}
        </div>
        <span class="group">${esc(it.group)}</span>
      </div>`).join('');
  }
  function setActive(i) {
    if (!items.length) return;
    active = (i + items.length) % items.length;
    list.querySelectorAll('.palette-row').forEach((r, idx) => r.classList.toggle('active', idx === active));
    const el = list.querySelector('.palette-row.active');
    if (el) el.scrollIntoView({ block: 'nearest' });
  }
  function runCurrent() {
    if (active < 0 || !items[active]) return;
    const it = items[active];
    close();
    try { it.run(); } catch (e) { toast('Could not run: ' + e.message); }
  }
  function close() {
    paletteOpen = false;
    paletteEl.remove();
    paletteEl = null;
    document.removeEventListener('keydown', onDocKey, true);
  }
  function onDocKey(e) {
    if (!paletteOpen) return;
    if (e.key === 'Escape') { e.preventDefault(); close(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); setActive(active + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(active - 1); }
    else if (e.key === 'Enter') { e.preventDefault(); runCurrent(); }
  }
  input.addEventListener('input', render);
  input.addEventListener('keydown', e => e.stopPropagation());
  list.addEventListener('click', e => {
    const row = e.target.closest('[data-i]');
    if (!row) return;
    active = +row.dataset.i;
    runCurrent();
  });
  paletteEl.addEventListener('click', e => { if (e.target === paletteEl) close(); });
  document.addEventListener('keydown', onDocKey, true);
  render();
  setTimeout(() => input.focus(), 20);
}
$('#paletteChip').onclick = openPalette;

/* ==========================================================================
   29. SHORTCUTS OVERLAY
   ========================================================================== */
function showShortcuts() {
  modal('Keyboard shortcuts', `
    <div class="shortcuts-grid">
      <div>
        <h4>Global</h4>
        <div class="shortcut-row"><span>Command palette</span><span><kbd>⌘</kbd><kbd>K</kbd></span></div>
        <div class="shortcut-row"><span>Focus search</span><span><kbd>/</kbd></span></div>
        <div class="shortcut-row"><span>Show this help</span><span><kbd>?</kbd></span></div>
        <div class="shortcut-row"><span>Close / dismiss</span><span><kbd>Esc</kbd></span></div>
        <div class="shortcut-row"><span>Toggle theme</span><span><kbd>⌘</kbd><kbd>⇧</kbd><kbd>D</kbd></span></div>
      </div>
      <div>
        <h4>Navigation</h4>
        <div class="shortcut-row"><span>Home</span><span><kbd>g</kbd><kbd>h</kbd></span></div>
        <div class="shortcut-row"><span>Search</span><span><kbd>g</kbd><kbd>s</kbd></span></div>
        <div class="shortcut-row"><span>Mail</span><span><kbd>g</kbd><kbd>m</kbd></span></div>
        <div class="shortcut-row"><span>Files</span><span><kbd>g</kbd><kbd>f</kbd></span></div>
        <div class="shortcut-row"><span>Calendar</span><span><kbd>g</kbd><kbd>c</kbd></span></div>
        <div class="shortcut-row"><span>Notes</span><span><kbd>g</kbd><kbd>n</kbd></span></div>
        <div class="shortcut-row"><span>Spageti AI</span><span><kbd>g</kbd><kbd>a</kbd></span></div>
      </div>
    </div>`);
}

/* ==========================================================================
   30. GLOBAL KEYBOARD SHORTCUTS
   ========================================================================== */
let gPrefix = false, gTimer = null;
function isTyping() {
  const el = document.activeElement;
  return !!el && (/^(input|textarea|select)$/i.test(el.tagName) || el.isContentEditable);
}
document.addEventListener('keydown', e => {
  if (isTyping() && !((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k')) return;
  const meta = e.metaKey || e.ctrlKey;

  if (meta && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); return; }
  if (meta && e.shiftKey && e.key.toLowerCase() === 'd') { e.preventDefault(); themeBtn.click(); return; }
  if (e.key === '?' && !meta) { e.preventDefault(); showShortcuts(); return; }

  if (e.key.toLowerCase() === 'g' && !meta && !e.repeat) {
    gPrefix = true;
    clearTimeout(gTimer);
    gTimer = setTimeout(() => { gPrefix = false; }, 900);
    return;
  }
  if (gPrefix) {
    const map = { h:'', s:'search', m:'courier', f:'vault', c:'almanac', n:'memo', t:'errand', d:'deck', a:'ai' };
    const target = map[e.key.toLowerCase()];
    if (target !== undefined) {
      e.preventDefault();
      location.hash = target ? '#/' + target : '';
    }
    gPrefix = false;
  }
});

/* ==========================================================================
   31. BOOT
   ========================================================================== */
window.addEventListener('hashchange', route);
route();

document.addEventListener('keydown', e => {
  if (e.key !== '/' || isTyping()) return;
  const inp = $('.searchbox input');
  if (inp) { e.preventDefault(); inp.focus(); inp.select(); }
});
</script>
